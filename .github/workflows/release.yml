name: release

# Publishes the CLI as a .NET tool to the organisation's GitHub Packages feed (owner decision E5), on a v* tag only. The
# version is VersionPrefix in Directory.Build.props with the suffix cleared (owner decision on #381); the tag must name
# it, or build/tool-check.sh fails before anything is packed. Bump the prefix after each release.
on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The generator's SDK, and the one generated projects pin: the check builds a generated project.
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - run: dnx --yes aspire.cli@13.6.4 -- setup --install-path "$HOME/.aspire"
      - run: dotnet build Fabric.slnx -c Release -p:VersionSuffix=
      # The generator's own tests; the pack and profile tests ran in ci.yml on the commit before it was tagged.
      - run: |
          dotnet test --project tests/Fabric.Core.Tests/Fabric.Core.Tests.csproj -c Release --no-build
          dotnet test --project tests/Fabric.Cli.Tests/Fabric.Cli.Tests.csproj -c Release --no-build
      # Packs the tool, installs it from the folder feed, generates a profile with it and builds the result.
      - run: build/tool-check.sh lean-crud "$RUNNER_TEMP/feed" --release "$GITHUB_REF_NAME"
      - env:
          NUGET_AUTH_TOKEN: ${{ github.token }}
        run: dotnet nuget push "$RUNNER_TEMP/feed/*.nupkg" --source https://nuget.pkg.github.com/smartsolutionslab/index.json --api-key "$NUGET_AUTH_TOKEN"
