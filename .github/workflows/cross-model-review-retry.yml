name: cross-model-review-retry

# Re-runs the cross-model reviews that the reviewer's usage limit postponed, once an hour (board protocol, docs/adr): a
# pull request whose verdict at its current head is still pending as postponed gets that review run again, which then
# reaches a verdict or is postponed once more. It reviews nothing itself: it can re-run workflows and read pull requests
# and commit statuses, and the review it starts holds the review's own permissions.
on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read
  statuses: read
  actions: write

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash .github/scripts/board/retry-reviews.sh
        env:
          GH_TOKEN: ${{ github.token }}

