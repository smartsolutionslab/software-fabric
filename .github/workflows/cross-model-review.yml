name: cross-model-review

# The reviewer is from a different model family than the author (board protocol, docs/adr). Its findings land on the
# pull request, and a blocking one fails the check.
# The reviewer is GitHub Copilot CLI, on the reviewing family's model (REVIEW_MODEL_CLAUDE, REVIEW_MODEL_CODEX below).
# It signs in with this workflow's own token (copilot-requests: write), so every review is billed to the organisation:
# that needs the organisation policy "Copilot CLI billed to the organization" and both models enabled. No secret, no
# personal token and no model vendor's API key is used.
#
# Three jobs, each its own required check: choose picks the model, review runs the reviewer, report posts its findings
# (a blocking one fails report; a reviewer that crashes fails review). The reviewer reads an untrusted diff, so its
# job holds no token that can write to the pull request, and nothing it writes reaches the verdict but its answer,
# which report takes as an artifact into a fresh checkout.
#
# The gate's own files (its scripts, the findings schema, the reviewer briefs) come from the base branch, checked out
# into .gate: a pull request must not choose its own reviewer or post its own verdict. The pull request's copies are
# used only while the base branch has none, which is the pull request that brings the protocol. This workflow file
# itself still comes from the pull request, so .github/ needs a code owner's review (docs/adr).
#
# A dependency update by Dependabot is not reviewed by a model: Dependabot's runs get a read-only token and no
# secrets. choose decides it with the base branch's dependency-update.sh (the pull request's author is
# dependabot[bot], and it changes dependency manifests and lockfiles only); review and report then pass with a note,
# and every other check still applies.
on:
  pull_request:
    types: [opened, synchronize, reopened]

# One run per workflow and ref; a review of a head that a newer push replaced is pointless, so it is cancelled
# and the new head is reviewed instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The model each family reviews with, by the ID Copilot gives it: the newest of that family Copilot offers. Change
  # them here, and only here, when Copilot offers newer ones (`copilot help config` lists them). A model the
  # organisation has not enabled makes copilot fail, and with it the review.
  REVIEW_MODEL_CLAUDE: claude-opus-5.5
  REVIEW_MODEL_CODEX: gpt-6.1-sol
  # An exact version: a new release changes the reviewer, so it arrives as a reviewed change here. Not named
  # COPILOT_*: copilot reads those as its own settings.
  REVIEWER_CLI_VERSION: 1.0.105

jobs:
  choose:
    runs-on: ubuntu-latest
    outputs:
      reviewer: ${{ steps.choose.outputs.reviewer }}
      model: ${{ steps.choose.outputs.model }}
      exempt: ${{ steps.exempt.outputs.exempt }}
      note: ${{ steps.exempt.outputs.note }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .gate
      - name: Use the gate's files from the base branch
        run: |
          if [ -f .gate/.github/scripts/board/reviewer.sh ]; then gate=.gate; else gate=.; fi
          echo "GATE=$gate/.github" >> "$GITHUB_ENV"
          echo "BRIEFS=$gate" >> "$GITHUB_ENV"
      - id: exempt
        name: A dependency update by Dependabot is not reviewed by a model
        # The author is the pull request's, not the actor of a re-run.
        run: |
          if note="$(bash "$GATE/scripts/board/dependency-update.sh" "$AUTHOR" "$BASE" "$HEAD")"; then
            echo "::notice title=cross-model review::$note"
            echo "exempt=true" >> "$GITHUB_OUTPUT"
            echo "note=$note" >> "$GITHUB_OUTPUT"
          else
            echo "$note"
            echo "exempt=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
      - id: choose
        # Assigned first: inside echo's arguments a failing reviewer.sh would not fail the step, and no review would run.
        # Against the base branch as it is now: the event's base.sha can predate commits merged in from it.
        run: |
          reviewer="$(bash "$GATE/scripts/board/reviewer.sh" "$BASE" "$HEAD")"
          setting="REVIEW_MODEL_${reviewer^^}"
          model="${!setting:-}"
          if [ -z "$model" ]; then
            echo "No model for the $reviewer reviewer: set $setting in this workflow's env." >&2
            exit 1
          fi
          echo "reviewer=$reviewer" >> "$GITHUB_OUTPUT"
          echo "model=$model" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: origin/${{ github.base_ref }}
          HEAD: ${{ github.event.pull_request.head.sha }}

  review:
    needs: choose
    runs-on: ubuntu-latest
    # Read the repository and call Copilot: nothing that writes to the pull request.
    permissions:
      contents: read
      copilot-requests: write
    env:
      EXEMPT: ${{ needs.choose.outputs.exempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .gate
      - name: Use the gate's files from the base branch
        run: |
          if [ -f .gate/.github/scripts/board/reviewer.sh ]; then gate=.gate; else gate=.; fi
          echo "GATE=$gate/.github" >> "$GITHUB_ENV"
          echo "BRIEFS=$gate" >> "$GITHUB_ENV"
      - name: Install the Copilot CLI
        run: |
          if [ "$EXEMPT" = true ]; then
            echo "Dependency update by Dependabot: not reviewed by a model."
            exit 0
          fi
          npm install -g "@github/copilot@$REVIEWER_CLI_VERSION"
      - name: Review
        # Copilot signs in with the workflow's token, and with nothing else: no GH_TOKEN or GITHUB_TOKEN, even one the
        # runner sets.
        # The folder stays untrusted and the pull request's AGENTS.md is not read (--no-custom-instructions), so the
        # change under review cannot give the reviewer instructions, hooks or MCP servers; its rules come from the
        # base branch's files instead. The diff is untrusted, so the reviewer may run only commands that read the
        # checkout; in prompt mode anything else (writes, other commands, any URL, paths outside the checkout) is
        # refused, since there is no one to ask. Its shell gets no token (--secret-env-vars).
        # The diff is against the base branch as it is now, like the reviewer's choice.
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          MODEL: ${{ needs.choose.outputs.model }}
          PR: ${{ github.event.pull_request.number }}
          BASE: origin/${{ github.base_ref }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EXEMPT" = true ]; then
            echo "Dependency update by Dependabot: not reviewed by a model." | tee "$RUNNER_TEMP/answer"
            exit 0
          fi
          schema="$(jq -c . "$GATE/review-findings.schema.json")"
          prompt="Review pull request #$PR: the change from $BASE to $HEAD in this checkout (git diff $BASE...$HEAD).
          Review it as the reviewers in $BRIEFS/.claude/agents/ describe (backend-reviewer, frontend-reviewer,
          security-reviewer: whichever the diff touches). Read $BRIEFS/AGENTS.md first: those are the base branch's
          rules, which the change is held to. Change no file and do not comment on the pull request.
          Answer with every finding: its file, its line (null when it has none), whether it is blocking or optional,
          and what is wrong. Your answer is one JSON object matching this JSON schema, and nothing else, not even a
          code fence: $schema"
          env -u GH_TOKEN -u GITHUB_TOKEN copilot -p "$prompt" --model "$MODEL" --silent --no-custom-instructions \
            --no-ask-user --disable-mcp-server github-mcp-server --disallow-temp-dir \
            --secret-env-vars=COPILOT_GITHUB_TOKEN \
            --allow-tool='shell(git diff)' --allow-tool='shell(git show)' --allow-tool='shell(git log)' \
            --allow-tool='shell(ls)' --allow-tool='shell(grep)' \
            > "$RUNNER_TEMP/answer"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: review-answer
          path: ${{ runner.temp }}/answer
          if-no-files-found: error

  report:
    needs: [choose, review]
    runs-on: ubuntu-latest
    # The only job that can write to the pull request. It never runs the reviewer, and takes the gate's files from a
    # checkout of its own: of the review, only the answer reaches it.
    permissions:
      contents: read
      pull-requests: write
    env:
      EXEMPT: ${{ needs.choose.outputs.exempt }}
      NOTE: ${{ needs.choose.outputs.note }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .gate
      - name: Use the gate's files from the base branch
        run: |
          if [ -f .gate/.github/scripts/board/report-review.sh ]; then gate=.gate; else gate=.; fi
          echo "GATE=$gate/.github" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: review-answer
          path: ${{ runner.temp }}/review
      - name: Post the findings; a blocking one fails this check
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REVIEWER: ${{ needs.choose.outputs.reviewer }}
          MODEL: ${{ needs.choose.outputs.model }}
        # An exempt pull request posts nothing: Dependabot's token cannot write to it.
        run: |
          if [ "$EXEMPT" = true ]; then
            echo "::notice title=cross-model review::$NOTE"
            exit 0
          fi
          bash "$GATE/scripts/board/report-review.sh" "$PR" "$RUNNER_TEMP/review/answer" "$REVIEWER ($MODEL)"

