name: ci

on:
  push:
    branches: [main]
  pull_request:

# One run per workflow and ref. A newer push to a pull request makes the run before it pointless, so it is cancelled;
# a run on main is never cancelled while it runs (one that is still waiting gives way to the newer push's).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      # The frontend tests install, build, lint and test generated web apps.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # The sign-in test drives a generated app in Chromium; the version matches the generated @playwright/test.
      - run: npx --yes playwright@1.63.0 install --with-deps chromium
      # Generated AppHosts use the Aspire CLI bundle; set it up once instead of letting parallel builds race to do it.
      - run: dnx --yes aspire.cli@13.6.4 -- setup --install-path "$HOME/.aspire"
      - run: dotnet restore Fabric.slnx
      - run: dotnet build Fabric.slnx -c Release --no-restore
      - run: dotnet test --solution Fabric.slnx -c Release --no-build
      - run: build/profiles.sh

  # Profile CI (ADR-0003, roadmap M1-09): every profile the real packs generate alone, listed by
  # build/complete-profiles.sh so a profile is picked up when its last pack lands; the others get a notice naming
  # the packs they lack.
  profiles:
    runs-on: ubuntu-latest
    outputs:
      complete: ${{ steps.list.outputs.profiles }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - run: dotnet build src/Fabric.Cli/Fabric.Cli.csproj -c Release
      - id: list
        run: build/complete-profiles.sh >> "$GITHUB_OUTPUT"

  # Each profile generated by the CLI from the real packs, put through its own CI's steps, in parallel.
  profile:
    needs: profiles
    name: profile-${{ matrix.profile }}
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.profiles.outputs.complete) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # Chromium's system libraries; the generated project installs the browser itself.
      - run: npx --yes playwright@1.63.0 install --with-deps chromium
      - run: dnx --yes aspire.cli@13.6.4 -- setup --install-path "$HOME/.aspire"
      - run: dotnet build Fabric.slnx -c Release
      - run: build/profile-ci.sh "${{ matrix.profile }}"
