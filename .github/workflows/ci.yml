name: ci

on:
  push:
    branches: [main]
  pull_request:

# One run per workflow and ref. A newer push to a pull request makes the run before it pointless, so it is cancelled;
# a run on main is never cancelled while it runs (one that is still waiting gives way to the newer push's).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The Playwright whose Chromium the jobs install and cache, in one place so the cache key cannot drift from what is
# installed. It matches the @playwright/test the frontend packs generate.
env:
  PLAYWRIGHT_VERSION: 1.63.0

jobs:
  # The solution's tests, in shards that run in parallel (#166). In one job they took 45-60 min, nearly all of it
  # Fabric.Packs.Tests, whose Docker-backed classes share fixed ports and so run one after another on a runner; on
  # separate runners they do not wait for each other. build/test-shards.txt says which classes each shard runs, from
  # their measured times; the last shard runs everything the file does not name. The build job below fails unless
  # every shard passed and every test method ran in one of them.
  tests:
    name: test-${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8, 9]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      # The frontend tests install, build, lint and test generated web apps.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # apt stalls at ~30 kB/s on some runners' first mirror (#218); a short timeout makes it retry and fall over to the
      # next mirror in the runner's list instead of waiting out each package.
      - run: printf 'Acquire::http::Timeout "10";\nAcquire::Retries "5";\n' | sudo tee /etc/apt/apt.conf.d/99-timeouts
      # The sign-in test drives a generated app in Chromium.
      # Chromium is cached per OS and Playwright version (#218): downloading it took up to 11 min on some runners. A
      # hit still installs the system libraries, which live outside the cache.
      - id: playwright
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - if: steps.playwright.outputs.cache-hit != 'true'
        run: npx --yes "playwright@$PLAYWRIGHT_VERSION" install --with-deps chromium
      - if: steps.playwright.outputs.cache-hit == 'true'
        run: npx --yes "playwright@$PLAYWRIGHT_VERSION" install-deps chromium
      # Generated AppHosts use the Aspire CLI bundle; set it up once instead of letting parallel builds race to do it.
      - run: dnx --yes aspire.cli@13.6.4 -- setup --install-path "$HOME/.aspire"
      - run: dotnet build Fabric.slnx -c Release
      # Each test assembly writes an xUnit XML report: what ran, and per-class and per-test times.
      - run: build/test-shard.sh "${{ matrix.shard }}" "$RUNNER_TEMP/test-results"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-results
          retention-days: 7

  # The required check. It waits for every shard, and is not skipped when one fails: a skipped required check would
  # count as passing.
  build:
    needs: tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every test shard passed
        if: needs.tests.result != 'success'
        run: |
          echo "::error title=tests::A test shard did not pass (${{ needs.tests.result }}); see the test-* jobs."
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - run: dotnet build Fabric.slnx -c Release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: test-results-*
          path: ${{ runner.temp }}/test-results
      # Every test project's every method ran in some shard; prints the counts per project.
      - run: |
          assemblies=()
          for project in tests/*/*.Tests.csproj; do
            name="$(basename "$project" .csproj)"
            assemblies+=("$(dirname "$project")/bin/Release/net10.0/$name.dll")
          done
          build/tests-all-ran.sh "$RUNNER_TEMP/test-results" "${assemblies[@]}"
      - run: build/profiles.sh

  # Profile CI (ADR-0003, roadmap M1-09, M2-06): every profile in the catalog, listed by build/complete-profiles.sh so
  # a new profile is picked up without editing this file; a profile whose packs are not all written fails this job,
  # naming the packs it lacks.
  profiles:
    runs-on: ubuntu-latest
    outputs:
      complete: ${{ steps.list.outputs.profiles }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - run: dotnet build src/Fabric.Cli/Fabric.Cli.csproj -c Release
      - id: list
        run: build/complete-profiles.sh >> "$GITHUB_OUTPUT"

  # Each profile generated by the CLI from the real packs, put through its own CI's steps, in parallel.
  profile:
    needs: profiles
    name: profile-${{ matrix.profile }}
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.profiles.outputs.complete) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # apt stalls at ~30 kB/s on some runners' first mirror (#218); a short timeout makes it retry and fall over to the
      # next mirror in the runner's list instead of waiting out each package.
      - run: printf 'Acquire::http::Timeout "10";\nAcquire::Retries "5";\n' | sudo tee /etc/apt/apt.conf.d/99-timeouts
      # The generated project's e2e tests drive Chromium; its own `playwright install` finds it here on a hit.
      # Chromium is cached per OS and Playwright version (#218): downloading it took up to 11 min on some runners. A
      # hit still installs the system libraries, which live outside the cache.
      - id: playwright
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - if: steps.playwright.outputs.cache-hit != 'true'
        run: npx --yes "playwright@$PLAYWRIGHT_VERSION" install --with-deps chromium
      - if: steps.playwright.outputs.cache-hit == 'true'
        run: npx --yes "playwright@$PLAYWRIGHT_VERSION" install-deps chromium
      - run: dnx --yes aspire.cli@13.6.4 -- setup --install-path "$HOME/.aspire"
      - run: dotnet build Fabric.slnx -c Release
      - run: build/profile-ci.sh "${{ matrix.profile }}"
