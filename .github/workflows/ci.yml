name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Fabric.slnx
      - run: dotnet build Fabric.slnx -c Release --no-restore
      - run: dotnet test --solution Fabric.slnx -c Release --no-build
