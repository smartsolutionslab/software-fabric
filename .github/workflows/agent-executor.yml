name: agent-executor

on:
  pull_request:
    types: [opened, synchronize, reopened]

# One run per workflow and ref; a newer push to the pull request checks every commit again, so the run before it is
# cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trailers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Every commit on an agent branch names its executor
        run: bash .github/scripts/board/check-trailers.sh "$BRANCH" "$BASE" "$HEAD"
        env:
          BRANCH: ${{ github.head_ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}

