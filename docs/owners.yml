# Who an escalated issue goes to (board protocol, ADR-0004). Owners are GitHub logins;
# the one with the fewest open assignments below the WIP limit gets it.
wip-limit: 3
lanes:
  generator: { owners: [notonlywhite] }
  packs-backend: { owners: [notonlywhite] }
  packs-frontend: { owners: [notonlywhite] }
  ci: { owners: [notonlywhite] }
