option: frontend.ui-library.shadcn
files:
  - { template: templates/components.json.sbn, target: web/app/components.json }
  - { template: templates/utils.ts.sbn, target: web/app/src/lib/utils.ts }
  - { template: templates/button.tsx.sbn, target: web/app/src/components/ui/button.tsx }
  - { template: templates/button.test.tsx.sbn, target: web/app/src/components/ui/button.test.tsx }
  - { template: templates/theme/theme.ts.sbn, target: web/app/src/theme/theme.ts }
  - { template: templates/theme/theme.test.ts.sbn, target: web/app/src/theme/theme.test.ts }
  - { template: templates/theme/contrast.test.ts.sbn, target: web/app/src/theme/contrast.test.ts }
  - { template: templates/theme/ThemeToggle.tsx.sbn, target: web/app/src/theme/ThemeToggle.tsx }
  - { template: templates/theme/ThemeToggle.test.tsx.sbn, target: web/app/src/theme/ThemeToggle.test.tsx }
  # The app shell (#695, #736), in a single-page app with react-router or TanStack Router: the registry's sidebar and
  # what it uses, breadcrumbs, the command palette (cmdk) and toasts (sonner), which src/lib/notify.tsx reports a
  # mutation's result in.
  - { template: templates/shell/sidebar.tsx.sbn, target: web/app/src/components/ui/sidebar.tsx, when: 'project["frontend.ui-library"] == "shadcn" && project["frontend.architecture"] == "spa" && (project["frontend.routing"] == "react-router" || project["frontend.routing"] == "tanstack-router")' }
  - { template: templates/shell/sheet.tsx.sbn, target: web/app/src/components/ui/sheet.tsx, when: 'project["frontend.ui-library"] == "shadcn" && project["frontend.architecture"] == "spa" && (project["frontend.routing"] == "react-router" || project["frontend.routing"] == "tanstack-router")' }
  - { template: templates/shell/tooltip.tsx.sbn, target: web/app/src/components/ui/tooltip.tsx, when: 'project["frontend.ui-library"] == "shadcn" && project["frontend.architecture"] == "spa" && (project["frontend.routing"] == "react-router" || project["frontend.routing"] == "tanstack-router")' }
  - { template: templates/shell/separator.tsx.sbn, target: web/app/src/components/ui/separator.tsx, when: 'project["frontend.ui-library"] == "shadcn" && project["frontend.architecture"] == "spa" && (project["frontend.routing"] == "react-router" || project["frontend.routing"] == "tanstack-router")' }
  - { template: templates/shell/input.tsx.sbn, target: web/app/src/components/ui/input.tsx, when: 'project["frontend.ui-library"] == "shadcn" && project["frontend.architecture"] == "spa" && (project["frontend.routing"] == "react-router" || project["frontend.routing"] == "tanstack-router")' }
  - { template: templates/shell/skeleton.tsx.sbn, target: web/app/src/components/ui/skeleton.tsx, when: 'project["frontend.ui-library"] == "shadcn" && project["frontend.architecture"] == "spa" && (project["frontend.routing"] == "react-router" || project["frontend.routing"] == "tanstack-router")' }
  - { template: templates/shell/breadcrumb.tsx.sbn, target: web/app/src/components/ui/breadcrumb.tsx, when: 'project["frontend.ui-library"] == "shadcn" && project["frontend.architecture"] == "spa" && (project["frontend.routing"] == "react-router" || project["frontend.routing"] == "tanstack-router")' }
  - { template: templates/shell/command.tsx.sbn, target: web/app/src/components/ui/command.tsx, when: 'project["frontend.ui-library"] == "shadcn" && project["frontend.architecture"] == "spa" && (project["frontend.routing"] == "react-router" || project["frontend.routing"] == "tanstack-router")' }
  - { template: templates/shell/dialog.tsx.sbn, target: web/app/src/components/ui/dialog.tsx, when: 'project["frontend.ui-library"] == "shadcn" && project["frontend.architecture"] == "spa" && (project["frontend.routing"] == "react-router" || project["frontend.routing"] == "tanstack-router")' }
  - { template: templates/shell/sonner.tsx.sbn, target: web/app/src/components/ui/sonner.tsx, when: 'project["frontend.ui-library"] == "shadcn" && project["frontend.architecture"] == "spa" && (project["frontend.routing"] == "react-router" || project["frontend.routing"] == "tanstack-router")' }
  - { template: templates/shell/use-mobile.ts.sbn, target: web/app/src/hooks/use-mobile.ts, when: 'project["frontend.ui-library"] == "shadcn" && project["frontend.architecture"] == "spa" && (project["frontend.routing"] == "react-router" || project["frontend.routing"] == "tanstack-router")' }
  - { template: templates/shell/notify.tsx.sbn, target: web/app/src/lib/notify.tsx, when: 'project["frontend.ui-library"] == "shadcn" && project["frontend.architecture"] == "spa" && (project["frontend.routing"] == "react-router" || project["frontend.routing"] == "tanstack-router")' }
  - { template: templates/shell/notify.test.tsx.sbn, target: web/app/src/lib/notify.test.tsx, when: 'project["frontend.ui-library"] == "shadcn" && project["frontend.architecture"] == "spa" && (project["frontend.routing"] == "react-router" || project["frontend.routing"] == "tanstack-router")' }
slots:
  - { slot: web.dependencies, template: templates/dependencies.sbn }
  - { slot: web.dev-dependencies, template: templates/dev-dependencies.sbn }
  - { slot: web.test-setup, template: templates/test-setup.sbn }
  - { slot: web.styles, template: templates/styles.sbn, order: 15 }
  - { slot: web.restricted-imports, template: templates/restricted.sbn, order: 20 }
  - { slot: web.head, template: templates/head.sbn }
  - { slot: web.shell-imports, template: templates/shell-import.sbn }
  - { slot: web.shell-actions, template: templates/shell-action.sbn }
  # Declared by the accessibility tests, an extra a project may leave out.
  - { slot: web.axe-themes, template: templates/axe-theme.sbn, optional: true }
agents:
  agents-md: docs/agents.md
adr: docs/adr.md
gates:
  - { kind: lint-rule, describes: "Importing another component library (MUI, Ant Design, Mantine, Chakra) fails lint.", file: templates/restricted.sbn }
  - { kind: ci-step, describes: "src/index.css defines the theme components.json names (cssVariables, slate) and applies its border, ring, background and foreground with @apply, so a theme that lacks them fails the build: Tailwind refuses an unknown utility in @apply.", file: templates/styles.sbn }
  - { kind: unit-test, describes: "Button renders a button in the theme's colours, has the registry's variants and sizes, and with asChild gives its child the button's look instead (src/components/ui/button.test.tsx).", file: templates/button.test.tsx.sbn }
  - { kind: unit-test, describes: "src/theme/contrast.test.ts reads both palettes of src/index.css, with a design system's tokens over them as built (light and dark), and fails when a text colour the components put on a background (foreground, card, popover, primary, secondary, accent, muted-foreground, destructive, sidebar) has less than WCAG AA's 4.5:1 in the light or the dark theme; jsdom computes no colours, so axe cannot.", file: templates/theme/contrast.test.ts.sbn }
  - { kind: unit-test, describes: "The theme toggle follows the system until a choice is made, remembers it, still works with storage blocked, and index.html sets the stored or system theme before the first paint (src/theme/ThemeToggle.test.tsx, src/theme/theme.test.ts).", file: templates/theme/ThemeToggle.test.tsx.sbn }
  - { kind: unit-test, describes: "With react-router or TanStack Router in a single-page app, notify reports a mutation's success in a toast as a status message and its failure as an alert (src/lib/notify.test.tsx).", file: templates/shell/notify.test.tsx.sbn }
