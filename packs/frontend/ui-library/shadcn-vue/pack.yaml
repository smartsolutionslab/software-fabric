option: frontend.ui-library.shadcn-vue
files:
  - { template: templates/components.json.sbn, target: web/app/components.json }
  - { template: templates/utils.ts.sbn, target: web/app/src/lib/utils.ts }
  - { template: templates/index.ts.sbn, target: web/app/src/components/ui/button/index.ts }
  - { template: templates/Button.vue.sbn, target: web/app/src/components/ui/button/Button.vue }
  - { template: templates/Button.test.ts.sbn, target: web/app/src/components/ui/button/Button.test.ts }
  # A dark palette and its toggle, unless a design system's tokens own the brand colours: they have no dark values.
  - { template: templates/theme/theme.ts.sbn, target: web/app/src/theme/theme.ts, when: 'project["frontend.design-system"] == "none"' }
  - { template: templates/theme/theme.test.ts.sbn, target: web/app/src/theme/theme.test.ts, when: 'project["frontend.design-system"] == "none"' }
  - { template: templates/theme/contrast.test.ts.sbn, target: web/app/src/theme/contrast.test.ts, when: 'project["frontend.design-system"] == "none"' }
  - { template: templates/theme/ThemeToggle.vue.sbn, target: web/app/src/theme/ThemeToggle.vue, when: 'project["frontend.design-system"] == "none"' }
  - { template: templates/theme/ThemeToggle.test.ts.sbn, target: web/app/src/theme/ThemeToggle.test.ts, when: 'project["frontend.design-system"] == "none"' }
slots:
  - { slot: web.dependencies, template: templates/dependencies.sbn }
  - { slot: web.dev-dependencies, template: templates/dev-dependencies.sbn }
  - { slot: web.styles, template: templates/styles.sbn, order: 20 }
  - { slot: web.restricted-imports, template: templates/restricted.sbn, order: 20 }
  - { slot: web.head, template: templates/head.sbn }
  - { slot: web.shell-imports, template: templates/shell-import.sbn }
  - { slot: web.shell-actions, template: templates/shell-action.sbn }
  # Declared by the accessibility tests, an extra a project may leave out.
  - { slot: web.axe-themes, template: templates/axe-theme.sbn, optional: true }
agents:
  agents-md: docs/agents.md
adr: docs/adr.md
gates:
  - { kind: lint-rule, describes: "Importing another Vue component library (PrimeVue, Vuetify, Quasar, Element Plus, Ant Design Vue, Naive UI, Headless UI, Radix Vue) fails lint.", file: templates/restricted.sbn }
  - { kind: ci-step, describes: "src/index.css defines the theme components.json names (cssVariables, slate) and applies its border, ring, background and foreground with @apply, so a theme that lacks them fails the build: Tailwind refuses an unknown utility in @apply.", file: templates/styles.sbn }
  - { kind: unit-test, describes: "Button renders a button in the theme's colours, has the registry's variants and sizes, and with as-child gives its child the button's look instead (src/components/ui/button/Button.test.ts).", file: templates/Button.test.ts.sbn }
  - { kind: unit-test, describes: "src/theme/contrast.test.ts reads both palettes of src/index.css and fails when a text colour the components put on a background (foreground, card, popover, primary, secondary, accent, muted-foreground, destructive, sidebar) has less than WCAG AA's 4.5:1 in the light or the dark theme; jsdom computes no colours, so axe cannot.", file: templates/theme/contrast.test.ts.sbn }
  - { kind: unit-test, describes: "The theme toggle follows the system until a choice is made, remembers it, still works with storage blocked, and index.html sets the stored or system theme before the first paint (src/theme/ThemeToggle.test.ts, src/theme/theme.test.ts).", file: templates/theme/ThemeToggle.test.ts.sbn }
