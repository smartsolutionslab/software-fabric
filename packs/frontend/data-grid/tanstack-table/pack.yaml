option: frontend.data-grid.tanstack-table
files:
  - { template: templates/data-table.tsx.sbn, target: web/app/src/components/ui/data-table.tsx, when: 'project["frontend.framework"] == "react"' }
  - { template: templates/data-table-columns.ts.sbn, target: web/app/src/components/ui/data-table-columns.ts }
  - { template: templates/data-table.test.tsx.sbn, target: web/app/src/components/ui/data-table.test.tsx, when: 'project["frontend.framework"] == "react"' }
  - { template: templates/DataTable.vue.sbn, target: web/app/src/components/ui/DataTable.vue, when: 'project["frontend.framework"] == "vue"' }
  - { template: templates/DataTable.test.ts.sbn, target: web/app/src/components/ui/DataTable.test.ts, when: 'project["frontend.framework"] == "vue"' }
  # CSS Modules (ADR-0006): the table's classes come from a module beside it; one stylesheet, named after each framework's component.
  - { template: templates/data-table.module.css.sbn, target: web/app/src/components/ui/data-table.module.css, when: 'project["frontend.framework"] == "react" && project["frontend.styling"] == "css-modules" && project["frontend.ui-library"] != "mui"' }
  - { template: templates/data-table.module.css.sbn, target: web/app/src/components/ui/DataTable.module.css, when: 'project["frontend.framework"] == "vue" && project["frontend.styling"] == "css-modules" && project["frontend.ui-library"] != "vuetify"' }
slots:
  - { slot: web.dependencies, template: templates/dependency.sbn }
  - { slot: web.restricted-imports, template: templates/restricted.sbn, order: 50 }
agents:
  agents-md: docs/agents.md
adr: docs/adr.md
gates:
  - { kind: lint-rule, describes: "Importing AG Grid fails lint.", file: templates/restricted.sbn }
