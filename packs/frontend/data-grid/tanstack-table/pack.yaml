  - { template: templates/data-table-columns.ts.sbn, target: web/app/src/components/ui/data-table-columns.ts }
  - { template: templates/data-table.test.tsx.sbn, target: web/app/src/components/ui/data-table.test.tsx, when: 'project["frontend.framework"] == "react"' }
  - { template: templates/DataTable.vue.sbn, target: web/app/src/components/ui/DataTable.vue, when: 'project["frontend.framework"] == "vue"' }
