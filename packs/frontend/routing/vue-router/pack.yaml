option: frontend.routing.vue-router
files:
  - { template: templates/App.vue.sbn, target: web/app/src/App.vue }
  - { template: templates/App.module.css.sbn, target: web/app/src/App.module.css, when: 'project["frontend.styling"] == "css-modules" && project["frontend.ui-library"] != "vuetify"' }
  - { template: templates/App.test.ts.sbn, target: web/app/src/App.test.ts }
  - { template: templates/router.ts.sbn, target: web/app/src/router.ts }
  - { template: templates/router-provider.ts.sbn, target: web/app/src/providers/router.ts }
  - { template: templates/modules.ts.sbn, target: web/app/src/modules/index.ts }
  - { template: templates/module-routes.ts.sbn, target: "web/app/src/modules/{{ module.name }}/routes.ts", per-module: true }
  - { template: templates/module-page.vue.sbn, target: "web/app/src/modules/{{ module.name }}/{{ module.namespace }}Page.vue", per-module: true }
  # With authorization choices, the module's page shows Manage only on a 200 from its probe, and any failure but a 403 as an alert; its test checks
  # all three, whether the page mounts a micro-frontend's remote (#609) or is a single-page app's screen, whose axe check beside it asks only accessibility (#664).
  - { template: templates/module-page.probe.test.ts.sbn, target: "web/app/src/modules/{{ module.name }}/{{ module.namespace }}Page.probe.test.ts", per-module: true, when: 'object.has_key(project, "backend.authorization") && array.size(project["backend.authorization"]) > 0 && (project["frontend.architecture"] == "micro-frontends" || (project["frontend.architecture"] == "spa" && !(module.name == "dashboards" && object.has_key(project, "frontend.dashboards") && array.contains(project["frontend.dashboards"], "user-editable") && project["frontend.api-client"] == "orval" && (!object.has_key(project, "frontend.state") || project["frontend.state"] != "pinia"))))' }
  - { template: templates/shell/AppShell.test.ts.sbn, target: web/app/src/shell/AppShell.test.ts, when: 'project["frontend.ui-library"] == "shadcn-vue" && project["frontend.architecture"] == "spa" && project["frontend.routing"] == "vue-router"' }
  - { template: templates/shell/AppShell.axe.test.ts.sbn, target: web/app/src/shell/AppShell.axe.test.ts, when: 'project["frontend.ui-library"] == "shadcn-vue" && project["frontend.architecture"] == "spa" && project["frontend.routing"] == "vue-router" && object.has_key(project, "frontend.test.extras") && array.contains(project["frontend.test.extras"], "accessibility")' }
declares-slots:
  - { slot: web.shell-imports, description: "Import lines of the app shell, src/App.vue's <script setup>: what the shell's actions use." }
  - { slot: web.shell-actions, description: "Elements at the end of the app shell's navigation bar, indented as its links are (six spaces): controls of the whole app (a theme toggle)." }
slots:
  - { slot: web.dependencies, template: templates/dependency.sbn }
  - { slot: web.imports, template: templates/import.sbn, order: 10 }
  - { slot: web.providers, template: templates/provider.sbn, order: 20 }
  - { slot: web.restricted-imports, template: templates/restricted.sbn, order: 10 }
agents:
  agents-md: docs/agents.md
adr: docs/adr.md
gates:
  - { kind: unit-test, describes: "The start page renders through the router and names the application (src/App.test.ts).", file: templates/App.test.ts.sbn }
  - { kind: lint-rule, describes: "Importing unplugin-vue-router (file-based routes) fails lint: routes are declared in src/router.ts and each module's routes.ts.", file: templates/restricted.sbn }
  - { kind: unit-test, describes: "With shadcn-vue in a single-page app, the shell's sidebar lists the start page and every module from its routes.ts and collapses, the breadcrumbs follow the route, and Ctrl+K or Cmd+K opens a command palette the keyboard alone goes to a page with (src/shell/AppShell.test.ts).", file: templates/shell/AppShell.test.ts.sbn }
  - { kind: unit-test, describes: "With shadcn-vue and the accessibility tests, axe finds no violations in the shell, its open command palette and its collapsed sidebar, in the light and the dark theme (src/shell/AppShell.axe.test.ts).", file: templates/shell/AppShell.axe.test.ts.sbn }
