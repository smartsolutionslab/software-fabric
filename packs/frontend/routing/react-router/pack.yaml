option: frontend.routing.react-router
files:
  - { template: templates/App.tsx.sbn, target: web/app/src/App.tsx }
  - { template: templates/App.module.css.sbn, target: web/app/src/App.module.css, when: 'project["frontend.styling"] == "css-modules" && project["frontend.ui-library"] != "mui"' }
  - { template: templates/App.test.tsx.sbn, target: web/app/src/App.test.tsx }
  - { template: templates/router.tsx.sbn, target: web/app/src/providers/router.tsx }
  - { template: templates/modules.ts.sbn, target: web/app/src/modules/index.ts }
  - { template: templates/module-routes.tsx.sbn, target: "web/app/src/modules/{{ module.name }}/routes.tsx", per-module: true }
  - { template: templates/module-page.tsx.sbn, target: "web/app/src/modules/{{ module.name }}/{{ module.namespace }}Page.tsx", per-module: true }
  # With authorization choices, a micro-frontend shell's page asks the module's probe around its remote (#609); its test checks both answers.
  - { template: templates/remote-module-page.test.tsx.sbn, target: "web/app/src/modules/{{ module.name }}/{{ module.namespace }}Page.probe.test.tsx", per-module: true, when: 'project["frontend.architecture"] == "micro-frontends" && object.has_key(project, "backend.authorization") && array.size(project["backend.authorization"]) > 0' }
slots:
  - { slot: web.dependencies, template: templates/dependency.sbn }
  - { slot: web.imports, template: templates/import.sbn, order: 10 }
  - { slot: web.providers, template: templates/provider.sbn, order: 20 }
  - { slot: web.restricted-imports, template: templates/restricted.sbn, order: 10 }
agents:
  agents-md: docs/agents.md
adr: docs/adr.md
gates:
  - { kind: lint-rule, describes: "Importing react-router-dom, the pre-v7 package name, fails lint.", file: templates/restricted.sbn }
