option: frontend.routing.react-router
files:
  - { template: templates/App.tsx.sbn, target: web/app/src/App.tsx }
  - { template: templates/App.module.css.sbn, target: web/app/src/App.module.css, when: 'project["frontend.styling"] == "css-modules" && project["frontend.ui-library"] != "mui"' }
  - { template: templates/App.test.tsx.sbn, target: web/app/src/App.test.tsx }
  - { template: templates/router.tsx.sbn, target: web/app/src/providers/router.tsx }
  - { template: templates/modules.ts.sbn, target: web/app/src/modules/index.ts }
  - { template: templates/module-routes.tsx.sbn, target: "web/app/src/modules/{{ module.name }}/routes.tsx", per-module: true }
  - { template: templates/module-page.tsx.sbn, target: "web/app/src/modules/{{ module.name }}/{{ module.namespace }}Page.tsx", per-module: true }
  # The module's sample (#734): its page's test and end-to-end test, where the page lists and creates samples.
  - { template: templates/module-page.test.tsx.sbn, target: "web/app/src/modules/{{ module.name }}/{{ module.namespace }}PageSamples.test.tsx", per-module: true, when: 'project["frontend.architecture"] == "spa" && object.has_key(project, "frontend.ui-library") && project["frontend.ui-library"] == "shadcn" && object.has_key(project, "frontend.api-client") && (project["frontend.api-client"] == "rtk-query-codegen" || project["frontend.api-client"] == "orval") && module.name != "dashboards" && module.name != "assistant"' }
  - { template: templates/samples.spec.ts.sbn, target: "web/app/e2e/{{ module.name }}-samples.spec.ts", per-module: true, when: 'project["frontend.architecture"] == "spa" && object.has_key(project, "frontend.ui-library") && project["frontend.ui-library"] == "shadcn" && object.has_key(project, "frontend.api-client") && (project["frontend.api-client"] == "rtk-query-codegen" || project["frontend.api-client"] == "orval") && module.name != "dashboards" && module.name != "assistant"' }
  # With authorization choices, the module's page shows Manage only on a 200 from its probe, and any failure but a 403 as an alert; its test checks
  # all three, whether the page mounts a micro-frontend's remote (#609) or is a single-page app's screen, whose axe check beside it asks only accessibility (#664).
  - { template: templates/module-page.probe.test.tsx.sbn, target: "web/app/src/modules/{{ module.name }}/{{ module.namespace }}Page.probe.test.tsx", per-module: true, when: 'object.has_key(project, "backend.authorization") && array.size(project["backend.authorization"]) > 0 && (project["frontend.architecture"] == "micro-frontends" || (project["frontend.architecture"] == "spa" && !(module.name == "dashboards" && object.has_key(project, "frontend.dashboards") && array.contains(project["frontend.dashboards"], "user-editable") && project["frontend.api-client"] == "rtk-query-codegen")))' }
  # With shadcn in a single-page app, src/App.tsx is the app shell (#695): a sidebar of the modules' routes, breadcrumbs, a command palette and toasts.
  - { template: templates/shell/Breadcrumbs.tsx.sbn, target: web/app/src/shell/Breadcrumbs.tsx, when: 'project["frontend.ui-library"] == "shadcn" && project["frontend.architecture"] == "spa" && project["frontend.routing"] == "react-router"' }
  - { template: templates/shell/CommandPalette.tsx.sbn, target: web/app/src/shell/CommandPalette.tsx, when: 'project["frontend.ui-library"] == "shadcn" && project["frontend.architecture"] == "spa" && project["frontend.routing"] == "react-router"' }
  - { template: templates/shell/AppShell.test.tsx.sbn, target: web/app/src/shell/AppShell.test.tsx, when: 'project["frontend.ui-library"] == "shadcn" && project["frontend.architecture"] == "spa" && project["frontend.routing"] == "react-router"' }
  - { template: templates/shell/AppShell.axe.test.tsx.sbn, target: web/app/src/shell/AppShell.axe.test.tsx, when: 'project["frontend.ui-library"] == "shadcn" && project["frontend.architecture"] == "spa" && project["frontend.routing"] == "react-router" && object.has_key(project, "frontend.test.extras") && array.contains(project["frontend.test.extras"], "accessibility")' }
declares-slots:
  - { slot: web.shell-imports, description: "Import lines of the app shell, src/App.tsx: what the shell's actions use." }
  - { slot: web.shell-actions, description: "Elements at the end of the app shell's navigation bar, indented as its links are (eight spaces): controls of the whole app (a theme toggle, a user menu). With shadcn in a single-page app they are the sidebar's footer, in contribution order." }
slots:
  - { slot: web.dependencies, template: templates/dependency.sbn }
  - { slot: web.imports, template: templates/import.sbn, order: 10 }
  - { slot: web.providers, template: templates/provider.sbn, order: 20 }
  - { slot: web.restricted-imports, template: templates/restricted.sbn, order: 10 }
agents:
  agents-md: docs/agents.md
adr: docs/adr.md
gates:
  - { kind: lint-rule, describes: "Importing react-router-dom, the pre-v7 package name, fails lint.", file: templates/restricted.sbn }
  - { kind: unit-test, describes: "With shadcn in a single-page app, the shell's sidebar lists the start page and every module from its routes.tsx and collapses, the breadcrumbs follow the route, and Ctrl+K or Cmd+K opens a command palette the keyboard alone goes to a page with (src/shell/AppShell.test.tsx).", file: templates/shell/AppShell.test.tsx.sbn }
  - { kind: unit-test, describes: "With shadcn and the accessibility tests, axe finds no violations in the shell, its open command palette and its collapsed sidebar, in the light and the dark theme (src/shell/AppShell.axe.test.tsx).", file: templates/shell/AppShell.axe.test.tsx.sbn }
