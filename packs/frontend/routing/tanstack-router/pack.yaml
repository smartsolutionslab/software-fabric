option: frontend.routing.tanstack-router
files:
  - { template: templates/App.tsx.sbn, target: web/app/src/App.tsx }
  - { template: templates/App.module.css.sbn, target: web/app/src/App.module.css, when: 'project["frontend.styling"] == "css-modules" && project["frontend.ui-library"] != "mui"' }
  - { template: templates/App.test.tsx.sbn, target: web/app/src/App.test.tsx }
  - { template: templates/router.tsx.sbn, target: web/app/src/router.tsx }
  - { template: templates/rootRoute.ts.sbn, target: web/app/src/rootRoute.ts }
  - { template: templates/router-provider.tsx.sbn, target: web/app/src/providers/router.tsx }
  - { template: templates/AppRouter.tsx.sbn, target: web/app/src/providers/AppRouter.tsx }
  - { template: templates/modules.ts.sbn, target: web/app/src/modules/index.ts }
  - { template: templates/module-routes.tsx.sbn, target: "web/app/src/modules/{{ module.name }}/routes.tsx", per-module: true }
  - { template: templates/module-page.tsx.sbn, target: "web/app/src/modules/{{ module.name }}/{{ module.namespace }}Page.tsx", per-module: true }
  # The module's sample (#734): its page's test and end-to-end test, where the page lists and creates samples.
  - { template: templates/module-page.test.tsx.sbn, target: "web/app/src/modules/{{ module.name }}/{{ module.namespace }}PageSamples.test.tsx", per-module: true, when: 'project["frontend.architecture"] == "spa" && object.has_key(project, "frontend.ui-library") && (project["frontend.ui-library"] == "shadcn" || project["frontend.ui-library"] == "shadcn-vue") && object.has_key(project, "frontend.api-client") && (project["frontend.api-client"] == "rtk-query-codegen" || project["frontend.api-client"] == "orval" || project["frontend.api-client"] == "openapi-fetch") && module.name != "dashboards" && module.name != "assistant"' }
  - { template: templates/samples.spec.ts.sbn, target: "web/app/e2e/{{ module.name }}-samples.spec.ts", per-module: true, when: 'project["frontend.architecture"] == "spa" && object.has_key(project, "frontend.ui-library") && (project["frontend.ui-library"] == "shadcn" || project["frontend.ui-library"] == "shadcn-vue") && object.has_key(project, "frontend.api-client") && (project["frontend.api-client"] == "rtk-query-codegen" || project["frontend.api-client"] == "orval" || project["frontend.api-client"] == "openapi-fetch") && module.name != "dashboards" && module.name != "assistant"' }
  # With authorization choices, the module's page shows Manage only on a 200 from its probe, and any failure but a 403 as an alert; its test checks
  # all three, whether the page mounts a micro-frontend's remote (#609) or is a single-page app's screen, whose axe check beside it asks only accessibility (#664).
  - { template: templates/module-page.probe.test.tsx.sbn, target: "web/app/src/modules/{{ module.name }}/{{ module.namespace }}Page.probe.test.tsx", per-module: true, when: 'object.has_key(project, "backend.authorization") && array.size(project["backend.authorization"]) > 0 && (project["frontend.architecture"] == "micro-frontends" || (project["frontend.architecture"] == "spa" && !(module.name == "dashboards" && object.has_key(project, "frontend.dashboards") && array.contains(project["frontend.dashboards"], "user-editable") && project["frontend.api-client"] == "rtk-query-codegen")))' }
declares-slots:
  - { slot: web.shell-imports, description: "Import lines of the app shell, src/App.tsx: what the shell's actions use." }
  - { slot: web.shell-actions, description: "Elements at the end of the app shell's navigation bar, indented as its links are (eight spaces): controls of the whole app (a theme toggle)." }
slots:
  - { slot: web.dependencies, template: templates/dependency.sbn }
  - { slot: web.imports, template: templates/import.sbn, order: 10 }
  - { slot: web.providers, template: templates/provider.sbn, order: 20 }
  - { slot: web.restricted-imports, template: templates/restricted.sbn, order: 10 }
agents:
  agents-md: docs/agents.md
adr: docs/adr.md
gates:
  - { kind: unit-test, describes: "The start page renders through the router and names the application (src/App.test.tsx).", file: templates/App.test.tsx.sbn }
  - { kind: lint-rule, describes: "Importing react-router or react-router-dom, or TanStack's file-based routing (@tanstack/router-plugin), fails lint: routes are declared in src/router.tsx and each module's routes.tsx.", file: templates/restricted.sbn }
  - { kind: analyzer, describes: "The router is registered for TypeScript, so a <Link> to a path no route has, a module's or a route below it, fails the type check of pnpm build.", file: templates/router.tsx.sbn }
