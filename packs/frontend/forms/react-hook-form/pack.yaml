option: frontend.forms.react-hook-form
files:
  # The module's sample on its page (#734), in a React single-page app with shadcn and a cached client.
  - { template: templates/CreateSampleForm.tsx.sbn, target: "web/app/src/modules/{{ module.name }}/Create{{ module.namespace }}SampleForm.tsx", per-module: true, when: 'project["frontend.framework"] == "react" && project["frontend.architecture"] == "spa" && object.has_key(project, "frontend.ui-library") && (project["frontend.ui-library"] == "shadcn" || project["frontend.ui-library"] == "shadcn-vue") && object.has_key(project, "frontend.api-client") && (project["frontend.api-client"] == "rtk-query-codegen" || project["frontend.api-client"] == "orval" || project["frontend.api-client"] == "openapi-fetch") && module.name != "dashboards" && module.name != "assistant"' }
slots:
  - { slot: web.dependencies, template: templates/dependencies.sbn }
  - { slot: web.restricted-imports, template: templates/restricted.sbn, order: 30 }
agents:
  agents-md: docs/agents.md
adr: docs/adr.md
gates:
  - { kind: lint-rule, describes: "Importing another form library (Formik, React Final Form) fails lint.", file: templates/restricted.sbn }
