option: frontend.forms.vee-validate
files:
  # @vee-validate/zod 4.15.1 peers zod 3; the pack adapts the shared zod 4 itself (owner decision on #23), and valibot
  # the same way, so the import stays @/forms/toTypedSchema (owner decision on #267).
  - { template: templates/toTypedSchema.ts.sbn, target: web/app/src/forms/toTypedSchema.ts }
  - { template: templates/toTypedSchema.test.ts.sbn, target: web/app/src/forms/toTypedSchema.test.ts }
  # The module's sample (#734): the form its page creates one with, in a Vue single-page app with shadcn-vue.
  - { template: templates/CreateSampleForm.vue.sbn, target: "web/app/src/modules/{{ module.name }}/Create{{ module.namespace }}SampleForm.vue", per-module: true, when: 'project["frontend.framework"] == "vue" && project["frontend.architecture"] == "spa" && object.has_key(project, "frontend.ui-library") && (project["frontend.ui-library"] == "shadcn" || project["frontend.ui-library"] == "shadcn-vue") && object.has_key(project, "frontend.api-client") && (project["frontend.api-client"] == "rtk-query-codegen" || project["frontend.api-client"] == "orval" || project["frontend.api-client"] == "openapi-fetch") && module.name != "dashboards" && module.name != "assistant"' }
slots:
  - { slot: web.dependencies, template: templates/dependencies.sbn }
  - { slot: web.restricted-imports, template: templates/restricted.sbn, order: 30 }
agents:
  agents-md: docs/agents.md
adr: docs/adr.md
gates:
  - { kind: lint-rule, describes: "Importing another form library (FormKit, TanStack Form) or the published adapter for the schema library (@vee-validate/zod, @vee-validate/valibot) fails lint.", file: templates/restricted.sbn }
  - { kind: unit-test, describes: "toTypedSchema puts a zod or valibot schema's messages on the fields they belong to, nested and listed ones too, and hands a valid form the schema's output (src/forms/toTypedSchema.test.ts).", file: templates/toTypedSchema.test.ts.sbn }
