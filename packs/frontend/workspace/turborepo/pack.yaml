option: frontend.workspace.turborepo
files:
  - { template: templates/package.json.sbn, target: web/package.json }
  - { template: templates/pnpm-workspace.yaml.sbn, target: web/pnpm-workspace.yaml }
  - { template: templates/turbo.json.sbn, target: web/turbo.json }
  - { template: templates/gitignore.sbn, target: web/.gitignore }
declares-slots:
  - { slot: web.workspace-packages, description: "Lines of pnpm-workspace.yaml's packages list ('  - app')." }
  - { slot: web.pnpm-overrides, description: "Entries of web/package.json's pnpm.overrides ('      \"swagger-parser\": \"12.1.0\"'): pnpm reads overrides only from the workspace root. Rendered only with a contribution.", separator: ",\n" }
slots:
  - { slot: ci.frontend-steps, template: templates/ci-steps.sbn, order: 10 }
  - { slot: readme.sections, template: templates/readme.sbn, order: 20 }
  - { slot: readme.first-steps, template: templates/first-steps.sbn }
  - { slot: dependabot.updates, template: templates/dependabot-updates.sbn }
agents:
  agents-md: docs/agents.md
adr: docs/adr.md
gates:
  - { kind: ci-step, describes: "The frontend job installs the workspace and runs build, lint and test in every package through turbo run, dependencies' builds first; CI keeps no Turborepo cache, so every package runs and any failure fails CI.", file: templates/ci-steps.sbn }
