option: frontend.api-client.rtk-query-codegen
files:
  - { template: templates/openapi-config.json.sbn, target: web/app/openapi-config.json }
  - { template: templates/openapi.json.sbn, target: web/app/openapi.json }
  - { template: templates/baseApi.ts.sbn, target: web/app/src/api/baseApi.ts }
  - { template: templates/gitignore.sbn, target: web/app/src/api/.gitignore }
  - { template: templates/OpenApiDocumentTests.cs.sbn, target: tests/Integration.Tests/OpenApiDocumentTests.cs }
declares-slots:
  - { slot: web.api-imports, description: "Import lines of src/api/baseApi.ts. Every api-client pack declares it." }
  - { slot: web.api-headers, description: "Statements in prepareHeaders, a function body, with Headers headers in scope (credentials). Every api-client pack declares it." }
slots:
  - { slot: web.dev-dependencies, template: templates/dev-dependency.sbn }
  - { slot: web.scripts, template: templates/scripts.sbn }
  - { slot: web.prepare, template: templates/prepare.sbn }
  - { slot: web.lint-ignores, template: templates/lint-ignore.sbn }
  - { slot: web.format-ignores, template: templates/format-ignore.sbn }
  - { slot: web.store-imports, template: templates/store-import.sbn }
  - { slot: web.store-reducers, template: templates/store-reducer.sbn }
  - { slot: web.store-middleware, template: templates/store-middleware.sbn }
agents:
  agents-md: docs/agents.md
adr: docs/adr.md
gates:
  - { kind: unit-test, describes: "An integration test compares web/app/openapi.json with the document the running host serves; a stale copy fails it (and is rewritten for the commit).", file: templates/OpenApiDocumentTests.cs.sbn }
