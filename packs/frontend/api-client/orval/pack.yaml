option: frontend.api-client.orval
files:
  - { template: templates/orval.config.ts.sbn, target: web/app/orval.config.ts }
  - { template: templates/openapi.json.sbn, target: web/app/openapi.json }
  - { template: templates/baseApi.ts.sbn, target: web/app/src/api/baseApi.ts }
  - { template: templates/gitignore.sbn, target: web/app/src/api/.gitignore }
  - { template: templates/OpenApiDocumentTests.cs.sbn, target: tests/Integration.Tests/OpenApiDocumentTests.cs }
  # With authorization choices: the hook a module's page asks its permission probe with (#609); not for the dashboards editor's page, which asks nothing.
  - { template: templates/useCanManage.ts.sbn, target: "web/app/src/modules/{{ module.name }}/useCanManage.ts", per-module: true, when: 'object.has_key(project, "backend.authorization") && array.size(project["backend.authorization"]) > 0 && project["frontend.architecture"] == "spa" && !(module.name == "dashboards" && object.has_key(project, "frontend.dashboards") && array.contains(project["frontend.dashboards"], "user-editable") && project["frontend.framework"] == "vue" && project["frontend.state"] != "pinia")' }
declares-slots:
  - { slot: web.api-imports, description: "Import lines of src/api/baseApi.ts. Every api-client pack declares it." }
  - { slot: web.api-headers, description: "Statements in apiFetch, before every call, with the request's Headers headers in scope. Every api-client pack declares it." }
  - { slot: web.openapi-paths, description: "Entries of web/app/openapi.json's paths after the host's own, indented four spaces. Every api-client pack declares it.", separator: ",\n" }
  - { slot: web.openapi-schemas, description: "Entries of web/app/openapi.json's components.schemas, one per contribution, indented six spaces; sorted by name with the host's own. Every api-client pack declares it.", separator: "\n\n" }
slots:
  - { slot: web.dev-dependencies, template: templates/dev-dependency.sbn }
  - { slot: web.scripts, template: templates/scripts.sbn }
  - { slot: web.prepare, template: templates/prepare.sbn }
  - { slot: web.lint-ignores, template: templates/lint-ignore.sbn }
  - { slot: web.format-ignores, template: templates/format-ignore.sbn }
agents:
  agents-md: docs/agents.md
adr: docs/adr.md
gates:
  - { kind: unit-test, describes: "An integration test compares web/app/openapi.json with the document the running host serves; a stale copy fails it (and is rewritten for the commit).", file: templates/OpenApiDocumentTests.cs.sbn }
