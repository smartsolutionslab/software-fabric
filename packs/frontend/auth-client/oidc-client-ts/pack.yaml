option: frontend.auth-client.oidc-client-ts
files:
  - { template: templates/oidcConfig.ts.sbn, target: web/app/src/auth/oidcConfig.ts }
  - { template: templates/accessToken.ts.sbn, target: web/app/src/auth/accessToken.ts }
  - { template: templates/SignedIn.tsx.sbn, target: web/app/src/auth/SignedIn.tsx, when: 'project["frontend.framework"] == "react"' }
  - { template: templates/useHasRole.ts.sbn, target: web/app/src/auth/useHasRole.ts, when: 'project["frontend.framework"] == "react" && object.has_key(project, "backend.authorization") && array.contains(project["backend.authorization"], "roles")' }
  - { template: templates/useHasClaim.ts.sbn, target: web/app/src/auth/useHasClaim.ts, when: 'project["frontend.framework"] == "react" && object.has_key(project, "backend.authorization") && array.contains(project["backend.authorization"], "claims")' }
  - { template: templates/RequirePermission.tsx.sbn, target: web/app/src/auth/RequirePermission.tsx, when: 'project["frontend.framework"] == "react" && object.has_key(project, "backend.authorization") && array.size(project["backend.authorization"]) > 0' }
  - { template: templates/RequirePermission.test.tsx.sbn, target: web/app/src/auth/RequirePermission.test.tsx, when: 'project["frontend.framework"] == "react" && object.has_key(project, "backend.authorization") && array.size(project["backend.authorization"]) > 0' }
  - { template: templates/auth-provider.tsx.sbn, target: web/app/src/providers/auth.tsx, when: 'project["frontend.framework"] == "react"' }
  # Vue (ADR-0006): useAuth() and SignedIn over oidc-client-ts's UserManager, no Vue OIDC library (owner decision on #23).
  - { template: templates/useAuth.ts.sbn, target: web/app/src/auth/useAuth.ts, when: 'project["frontend.framework"] == "vue"' }
  - { template: templates/SignedIn.vue.sbn, target: web/app/src/auth/SignedIn.vue, when: 'project["frontend.framework"] == "vue"' }
  # CSS Modules (ADR-0006): SignedIn's bar takes its class from a module beside it, in either framework.
  - { template: templates/SignedIn.module.css.sbn, target: web/app/src/auth/SignedIn.module.css, when: 'project["frontend.styling"] == "css-modules"' }
  - { template: templates/SignedIn.test.ts.sbn, target: web/app/src/auth/SignedIn.test.ts, when: 'project["frontend.framework"] == "vue"' }
  - { template: templates/auth-provider.ts.sbn, target: web/app/src/providers/auth.ts, when: 'project["frontend.framework"] == "vue"' }
  - { template: templates/RequirePermission.vue-pending.test.ts.sbn, target: web/app/src/auth/RequirePermission.test.ts, when: 'project["frontend.framework"] == "vue" && object.has_key(project, "backend.authorization") && array.size(project["backend.authorization"]) > 0' }
  - { template: templates/sign-in.spec.ts.sbn, target: web/app/e2e/sign-in.spec.ts }
slots:
  - { slot: templates.functions, template: templates/functions.sbn }
  - { slot: web.dependencies, template: templates/dependencies.sbn }
  - { slot: web.imports, template: templates/import.sbn, order: 0 }
  - { slot: web.providers, template: templates/provider.sbn, order: 0 }
  - { slot: web.env, template: templates/env.sbn }
  - { slot: web.api-imports, template: templates/api-import.sbn }
  - { slot: web.api-headers, template: templates/api-headers.sbn }
agents:
  agents-md: docs/agents.md
adr: docs/adr.md
gates:
  - { kind: unit-test, describes: "With backend.authorization roles or claims, RequirePermission and the useHasRole / useHasClaim hooks show an element to a user the ID token says holds the role or claim and hide it from one who does not (src/auth/RequirePermission.test.tsx).", file: templates/RequirePermission.test.tsx.sbn }
  - { kind: unit-test, describes: "With Vue, SignedIn sends an anonymous visitor (or one whose access token expired) to the identity provider, completes the sign-in on the way back, shows a failed sign-in, renewal or redirect, and shows a signed-in user and the application (src/auth/SignedIn.test.ts).", file: templates/SignedIn.test.ts.sbn }
  - { kind: end-to-end-test, describes: "A realm user signs in through the identity provider and sees the application (e2e/sign-in.spec.ts, run against the running AppHost).", file: templates/sign-in.spec.ts.sbn }
