option: frontend.auth-client.oidc-client-ts
files:
  - { template: templates/oidcConfig.ts.sbn, target: web/app/src/auth/oidcConfig.ts }
  - { template: templates/accessToken.ts.sbn, target: web/app/src/auth/accessToken.ts }
  - { template: templates/SignedIn.tsx.sbn, target: web/app/src/auth/SignedIn.tsx, when: 'project["frontend.framework"] == "react"' }
  - { template: templates/useHasRole.ts.sbn, target: web/app/src/auth/useHasRole.ts, when: 'object.has_key(project, "backend.authorization") && array.contains(project["backend.authorization"], "roles")' }
  - { template: templates/useHasClaim.ts.sbn, target: web/app/src/auth/useHasClaim.ts, when: 'object.has_key(project, "backend.authorization") && array.contains(project["backend.authorization"], "claims")' }
  - { template: templates/RequirePermission.tsx.sbn, target: web/app/src/auth/RequirePermission.tsx, when: 'project["frontend.framework"] == "react" && object.has_key(project, "backend.authorization") && array.size(project["backend.authorization"]) > 0' }
  - { template: templates/RequirePermission.test.tsx.sbn, target: web/app/src/auth/RequirePermission.test.tsx, when: 'project["frontend.framework"] == "react" && object.has_key(project, "backend.authorization") && array.size(project["backend.authorization"]) > 0' }
  - { template: templates/auth-provider.tsx.sbn, target: web/app/src/providers/auth.tsx, when: 'project["frontend.framework"] == "react"' }
  # Vue (ADR-0006): useAuth() and SignedIn over oidc-client-ts's UserManager, no Vue OIDC library (owner decision on #23).
  - { template: templates/useAuth.ts.sbn, target: web/app/src/auth/useAuth.ts, when: 'project["frontend.framework"] == "vue"' }
  - { template: templates/SignedIn.vue.sbn, target: web/app/src/auth/SignedIn.vue, when: 'project["frontend.framework"] == "vue"' }
  # CSS Modules (ADR-0006): SignedIn's bar takes its class from a module beside it, in either framework.
  - { template: templates/SignedIn.module.css.sbn, target: web/app/src/auth/SignedIn.module.css, when: 'project["frontend.styling"] == "css-modules" && project["frontend.ui-library"] != "mui" && project["frontend.ui-library"] != "vuetify"' }
  - { template: templates/SignedIn.test.ts.sbn, target: web/app/src/auth/SignedIn.test.ts, when: 'project["frontend.framework"] == "vue"' }
  - { template: templates/auth-provider.ts.sbn, target: web/app/src/providers/auth.ts, when: 'project["frontend.framework"] == "vue"' }
  # Vue (#517): RequirePermission.vue over the composables in useHasRole.ts and useHasClaim.ts, which read useAuth(); no catalog rule (owner decision on #517).
  - { template: templates/RequirePermission.vue.sbn, target: web/app/src/auth/RequirePermission.vue, when: 'project["frontend.framework"] == "vue" && object.has_key(project, "backend.authorization") && array.size(project["backend.authorization"]) > 0' }
  - { template: templates/RequirePermission.test.ts.sbn, target: web/app/src/auth/RequirePermission.test.ts, when: 'project["frontend.framework"] == "vue" && object.has_key(project, "backend.authorization") && array.size(project["backend.authorization"]) > 0' }
  - { template: templates/sign-in.spec.ts.sbn, target: web/app/e2e/sign-in.spec.ts }
  # The screens' axe checks (frontend.test.extras accessibility, #661) render a screen for the local user developer, signed in, through these; the provider's names stay in this pack.
  - { template: templates/SignedInAsDeveloper.tsx.sbn, target: web/app/src/auth/SignedInAsDeveloper.tsx, when: 'project["frontend.framework"] == "react" && object.has_key(project, "frontend.test.extras") && array.contains(project["frontend.test.extras"], "accessibility") && project["frontend.architecture"] == "spa"' }
  - { template: templates/signedInAsDeveloper.ts.sbn, target: web/app/src/auth/signedInAsDeveloper.ts, when: 'project["frontend.framework"] == "vue" && object.has_key(project, "frontend.test.extras") && array.contains(project["frontend.test.extras"], "accessibility") && project["frontend.architecture"] == "spa"' }
  # The app shell's user menu (#695): the name the host's /me answers and Sign out, in the sidebar of shadcn's or shadcn-vue's shell.
  - { template: templates/shell/UserMenu.tsx.sbn, target: web/app/src/auth/UserMenu.tsx, when: 'project["frontend.ui-library"] == "shadcn" && project["frontend.architecture"] == "spa" && (project["frontend.routing"] == "react-router" || project["frontend.routing"] == "tanstack-router")' }
  - { template: templates/shell/UserMenu.test.tsx.sbn, target: web/app/src/auth/UserMenu.test.tsx, when: 'project["frontend.ui-library"] == "shadcn" && project["frontend.architecture"] == "spa" && (project["frontend.routing"] == "react-router" || project["frontend.routing"] == "tanstack-router")' }
  - { template: templates/shell/UserMenu.vue.sbn, target: web/app/src/auth/UserMenu.vue, when: 'project["frontend.ui-library"] == "shadcn-vue" && project["frontend.architecture"] == "spa" && project["frontend.routing"] == "vue-router"' }
  - { template: templates/shell/UserMenu.test.ts.sbn, target: web/app/src/auth/UserMenu.test.ts, when: 'project["frontend.ui-library"] == "shadcn-vue" && project["frontend.architecture"] == "spa" && project["frontend.routing"] == "vue-router"' }
slots:
  - { slot: templates.functions, template: templates/functions.sbn }
  - { slot: web.dependencies, template: templates/dependencies.sbn }
  - { slot: web.imports, template: templates/import.sbn, order: 0 }
  - { slot: web.providers, template: templates/provider.sbn, order: 0 }
  - { slot: web.env, template: templates/env.sbn }
  - { slot: web.api-imports, template: templates/api-import.sbn }
  - { slot: web.api-headers, template: templates/api-headers.sbn }
  # After the UI library's controls (the theme toggle): the user menu is the shell's last.
  - { slot: web.shell-imports, template: templates/shell-import.sbn, order: 10 }
  - { slot: web.shell-actions, template: templates/shell-action.sbn, order: 10 }
agents:
  agents-md: docs/agents.md
adr: docs/adr.md
gates:
  - { kind: unit-test, describes: "With backend.authorization roles or claims, RequirePermission and the useHasRole / useHasClaim hooks show an element to a user the ID token says holds the role or claim and hide it from one who does not (src/auth/RequirePermission.test.tsx).", file: templates/RequirePermission.test.tsx.sbn }
  - { kind: unit-test, describes: "With Vue and backend.authorization roles or claims, RequirePermission.vue and the useHasRole / useHasClaim composables show an element to a user the ID token says holds the role or claim and hide it from one who does not (src/auth/RequirePermission.test.ts).", file: templates/RequirePermission.test.ts.sbn }
  - { kind: unit-test, describes: "With Vue, SignedIn sends an anonymous visitor (or one whose access token expired) to the identity provider, completes the sign-in on the way back, shows a failed sign-in, renewal or redirect, and shows a signed-in user and the application (src/auth/SignedIn.test.ts).", file: templates/SignedIn.test.ts.sbn }
  - { kind: end-to-end-test, describes: "A realm user signs in through the identity provider and sees the application (e2e/sign-in.spec.ts, run against the running AppHost).", file: templates/sign-in.spec.ts.sbn }
  - { kind: unit-test, describes: "In the shell of shadcn or shadcn-vue, the user menu names the user as /me answers and signs out through the identity provider (src/auth/UserMenu.test.tsx, src/auth/UserMenu.test.ts).", file: templates/shell/UserMenu.test.tsx.sbn }
