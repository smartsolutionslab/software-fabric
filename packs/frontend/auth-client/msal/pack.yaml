option: frontend.auth-client.msal
files:
  - { template: templates/msalConfig.ts.sbn, target: web/app/src/auth/msalConfig.ts }
  - { template: templates/msalConfig.test.ts.sbn, target: web/app/src/auth/msalConfig.test.ts }
  - { template: templates/msal.ts.sbn, target: web/app/src/auth/msal.ts }
  - { template: templates/accessToken.ts.sbn, target: web/app/src/auth/accessToken.ts }
  - { template: templates/SignedIn.tsx.sbn, target: web/app/src/auth/SignedIn.tsx, when: 'project["frontend.framework"] == "react"' }
  - { template: templates/SignedIn.test.tsx.sbn, target: web/app/src/auth/SignedIn.test.tsx, when: 'project["frontend.framework"] == "react"' }
  - { template: templates/useHasRole.ts.sbn, target: web/app/src/auth/useHasRole.ts, when: 'object.has_key(project, "backend.authorization") && array.contains(project["backend.authorization"], "roles")' }
  - { template: templates/useHasClaim.ts.sbn, target: web/app/src/auth/useHasClaim.ts, when: 'object.has_key(project, "backend.authorization") && array.contains(project["backend.authorization"], "claims")' }
  - { template: templates/RequirePermission.tsx.sbn, target: web/app/src/auth/RequirePermission.tsx, when: 'project["frontend.framework"] == "react" && object.has_key(project, "backend.authorization") && array.size(project["backend.authorization"]) > 0' }
  - { template: templates/RequirePermission.test.tsx.sbn, target: web/app/src/auth/RequirePermission.test.tsx, when: 'project["frontend.framework"] == "react" && object.has_key(project, "backend.authorization") && array.size(project["backend.authorization"]) > 0' }
  - { template: templates/Started.tsx.sbn, target: web/app/src/auth/Started.tsx, when: 'project["frontend.framework"] == "react"' }
  - { template: templates/auth-provider.tsx.sbn, target: web/app/src/providers/auth.tsx, when: 'project["frontend.framework"] == "react"' }
  - { template: templates/auth-provider.test.tsx.sbn, target: web/app/src/providers/auth.test.tsx, when: 'project["frontend.framework"] == "react"' }
  # Vue (ADR-0006): useAuth() and SignedIn over @azure/msal-browser's PublicClientApplication; @azure/msal-react is React's only (owner decision on #266).
  - { template: templates/useAuth.ts.sbn, target: web/app/src/auth/useAuth.ts, when: 'project["frontend.framework"] == "vue"' }
  - { template: templates/SignedIn.vue.sbn, target: web/app/src/auth/SignedIn.vue, when: 'project["frontend.framework"] == "vue"' }
  # CSS Modules (ADR-0006): SignedIn's bar takes its class from a module beside it, in either framework.
  - { template: templates/SignedIn.module.css.sbn, target: web/app/src/auth/SignedIn.module.css, when: 'project["frontend.styling"] == "css-modules" && project["frontend.ui-library"] != "mui"' }
  - { template: templates/SignedIn.test.ts.sbn, target: web/app/src/auth/SignedIn.test.ts, when: 'project["frontend.framework"] == "vue"' }
  - { template: templates/auth-provider.ts.sbn, target: web/app/src/providers/auth.ts, when: 'project["frontend.framework"] == "vue"' }
  # Vue (#517): RequirePermission.vue over the composables in useHasRole.ts and useHasClaim.ts, which read useAuth(); no catalog rule (owner decision on #517).
  - { template: templates/RequirePermission.vue.sbn, target: web/app/src/auth/RequirePermission.vue, when: 'project["frontend.framework"] == "vue" && object.has_key(project, "backend.authorization") && array.size(project["backend.authorization"]) > 0' }
  - { template: templates/RequirePermission.test.ts.sbn, target: web/app/src/auth/RequirePermission.test.ts, when: 'project["frontend.framework"] == "vue" && object.has_key(project, "backend.authorization") && array.size(project["backend.authorization"]) > 0' }
slots:
  - { slot: templates.functions, template: templates/functions.sbn }
  - { slot: web.dependencies, template: templates/dependencies.sbn }
  - { slot: web.imports, template: templates/import.sbn, order: 0 }
  - { slot: web.providers, template: templates/provider.sbn, order: 0 }
  - { slot: web.env, template: templates/env.sbn }
  - { slot: web.api-imports, template: templates/api-import.sbn }
  - { slot: web.api-headers, template: templates/api-headers.sbn }
agents:
  agents-md: docs/agents.md
adr: docs/adr.md
gates:
  - { kind: unit-test, describes: "msal-browser, with fetch answering as the stand-in, accepts the web app's MSAL configuration as built (VITE_OIDC_AUTHORITY or its fallback): the authority is https, a sign-in goes to the stand-in's authorization endpoint with PKCE and response_mode=query, and coming back signs the user in and keeps the access token. An http authority fails it with authority_uri_insecure (src/auth/msalConfig.test.ts).", file: templates/msalConfig.test.ts.sbn }
  - { kind: unit-test, describes: "With React, SignedIn sends an anonymous visitor (or one whose access token expired) to the identity provider, waits while MSAL completes the way back, shows a failed sign-in or redirect without retrying it, and shows a signed-in user and the application (src/auth/SignedIn.test.tsx).", file: templates/SignedIn.test.tsx.sbn }
  - { kind: unit-test, describes: "With React, an MSAL client whose initialize() rejects is shown as a failed sign-in, not left signing in (src/providers/auth.test.tsx).", file: templates/auth-provider.test.tsx.sbn }
  - { kind: unit-test, describes: "With Vue, SignedIn does the same over the useAuth() composable (src/auth/SignedIn.test.ts).", file: templates/SignedIn.test.ts.sbn }
  - { kind: unit-test, describes: "With React and backend.authorization roles or claims, RequirePermission and the useHasRole / useHasClaim hooks show an element to a user whose ID token holds the role or claim and hide it from one whose does not (src/auth/RequirePermission.test.tsx).", file: templates/RequirePermission.test.tsx.sbn }
  - { kind: unit-test, describes: "With Vue and backend.authorization roles or claims, RequirePermission.vue and the useHasRole / useHasClaim composables show an element to a user whose ID token holds the role or claim and hide it from one whose does not (src/auth/RequirePermission.test.ts).", file: templates/RequirePermission.test.ts.sbn }
