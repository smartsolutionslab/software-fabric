option: frontend.agent-ui.ag-ui
modules:
  assistant: { module.style: crud, module.cqrs: logical }
files:
  - { template: templates/BuildingBlocks/IAgentConversation.cs.sbn, target: src/BuildingBlocks/Agents/IAgentConversation.cs }
  - { template: templates/BuildingBlocks/IAgentConversationOfSelf.cs.sbn, target: "src/BuildingBlocks/Agents/IAgentConversation{TSelf}.cs" }
  - { template: templates/BuildingBlocks/AgentConversation.cs.sbn, target: src/BuildingBlocks/Agents/AgentConversation.cs }
  - { template: templates/BuildingBlocks/AgentConversationRegistration.cs.sbn, target: src/BuildingBlocks/Agents/Wiring/AgentConversationRegistration.cs }
  - { template: templates/Host/AgentUiRegistration.cs.sbn, target: src/Host/Wiring/AgentUiRegistration.cs }
  - { template: templates/Host/AgentUiEndpoints.cs.sbn, target: src/Host/Wiring/AgentUiEndpoints.cs }
  - { template: templates/Host/AgentConversations.cs.sbn, target: src/Host/Agents/AgentConversations.cs }
  - { template: templates/Host/AgentRuns.cs.sbn, target: src/Host/Agents/AgentRuns.cs }
  - { template: templates/Host/AgentEvents.cs.sbn, target: src/Host/Agents/AgentEvents.cs }
  - { template: templates/Host/StandInChatClient.cs.sbn, target: src/Host/Agents/StandInChatClient.cs }
  - { template: templates/Module/AssistantAgent.cs.sbn, target: "src/Modules/{{ module.namespace }}/{{ module.namespace }}.Application/Agents/AssistantAgent.cs", per-module: true, when: 'module.name == "assistant"' }
  - { template: templates/Module/TalkToTheAssistant.cs.sbn, target: "src/Modules/{{ module.namespace }}/{{ module.namespace }}.Application/Queries/TalkToTheAssistant/TalkToTheAssistant.cs", per-module: true, when: 'module.name == "assistant"' }
  - { template: templates/Module/TalkToTheAssistantHandler.cs.sbn, target: "src/Modules/{{ module.namespace }}/{{ module.namespace }}.Application/Queries/TalkToTheAssistant/TalkToTheAssistantHandler.cs", per-module: true, when: 'module.name == "assistant"' }
  - { template: templates/Module/CountWords.cs.sbn, target: "src/Modules/{{ module.namespace }}/{{ module.namespace }}.Application/Queries/CountWords/CountWords.cs", per-module: true, when: 'module.name == "assistant"' }
  - { template: templates/Module/CountWordsHandler.cs.sbn, target: "src/Modules/{{ module.namespace }}/{{ module.namespace }}.Application/Queries/CountWords/CountWordsHandler.cs", per-module: true, when: 'module.name == "assistant"' }
  - { template: templates/Module/AssistantFailures.cs.sbn, target: "src/Modules/{{ module.namespace }}/{{ module.namespace }}.Application/AssistantFailures.cs", per-module: true, when: 'module.name == "assistant"' }
  - { template: templates/Module/NothingToCount.cs.sbn, target: "src/Modules/{{ module.namespace }}/{{ module.namespace }}.Application/NothingToCount.cs", per-module: true, when: 'module.name == "assistant"' }
  - { template: templates/tests/TalkToTheAssistantTests.cs.sbn, target: "tests/Modules/{{ module.namespace }}.Tests/Queries/TalkToTheAssistantTests.cs", per-module: true, when: 'module.name == "assistant"' }
  - { template: templates/tests/AgentUiGoesThroughAQuery.cs.sbn, target: tests/Architecture.Tests/Rules/AgentUiGoesThroughAQuery.cs }
  - { template: templates/tests/AgentUiTests.cs.sbn, target: tests/Integration.Tests/AgentUiTests.cs }
  # The panel, for a React or Vue single-page app; elsewhere a test that fails saying it is not built yet (ADR-0006).
  # connectAgent is the same for both; useAgent is a hook or a composable, branched in its template.
  - { template: templates/web/connectAgent.ts.sbn, target: web/app/src/agents/connectAgent.ts, when: '(project["frontend.framework"] == "react" || project["frontend.framework"] == "vue") && project["frontend.architecture"] == "spa"' }
  - { template: templates/web/useAgent.ts.sbn, target: web/app/src/agents/useAgent.ts, when: '(project["frontend.framework"] == "react" || project["frontend.framework"] == "vue") && project["frontend.architecture"] == "spa"' }
  - { template: templates/web/AgentPanel.tsx.sbn, target: web/app/src/agents/AgentPanel.tsx, when: 'project["frontend.framework"] == "react" && project["frontend.architecture"] == "spa"' }
  - { template: templates/web/AgentPanel.test.tsx.sbn, target: web/app/src/agents/AgentPanel.test.tsx, when: 'project["frontend.framework"] == "react" && project["frontend.architecture"] == "spa"' }
  - { template: templates/web/AgentPanel.vue.sbn, target: web/app/src/agents/AgentPanel.vue, when: 'project["frontend.framework"] == "vue" && project["frontend.architecture"] == "spa"' }
  - { template: templates/web/AgentConversation.vue.sbn, target: web/app/src/agents/AgentConversation.vue, when: 'project["frontend.framework"] == "vue" && project["frontend.architecture"] == "spa"' }
  - { template: templates/web/agent-panel.spec.ts.sbn, target: web/app/e2e/agent-panel.spec.ts, when: '(project["frontend.framework"] == "react" || project["frontend.framework"] == "vue") && project["frontend.architecture"] == "spa"' }
  # Vue's component test; with micro-frontends, a test that fails saying the panel is not built there yet.
  - { template: templates/web/AgentPanel.test.ts.sbn, target: web/app/src/agents/AgentPanel.test.ts, when: 'project["frontend.framework"] != "react" || project["frontend.architecture"] != "spa"' }
slots:
  - { slot: dotnet.package-versions, template: templates/package-versions.sbn }
  - { slot: host.packages, template: templates/host-packages.sbn }
  # After the provider's chat client, which the stand-in model replaces in tests.
  - { slot: host.services, template: templates/host-services.sbn, order: 40 }
  - { slot: host.endpoints, template: templates/host-endpoints.sbn, order: 40 }
  - { slot: modules.infrastructure, template: templates/module-infrastructure.sbn, order: 60 }
  - { slot: apphost.resources, template: templates/apphost-resources.sbn, order: 40 }
  - { slot: apphost.host-wiring, template: templates/apphost-host-wiring.sbn, order: 40 }
  - { slot: integration-tests.parameters, template: templates/integration-tests-parameters.sbn, optional: true }
  # AGUIServerInstrumentation.ActivitySourceName, spelled out because ServiceDefaults does not reference the SDK. Its agui.run
  # span carries a mid-stream failure, which the browser sees only as a generic RUN_ERROR; without a listener, no span.
  - { slot: service-defaults.activity-sources, template: templates/service-defaults-activity-sources.sbn }
  - { slot: e2e.apphost-arguments, template: templates/e2e-apphost-arguments.sbn, order: 90 }
  - { slot: web.dependencies, template: templates/web-dependency.sbn }
  - { slot: web.restricted-imports, template: templates/web-restricted.sbn, order: 50 }
  # The assistant module's sample policy endpoint, with authorization choices; before the dashboards module's, as the host maps modules by name.
  - { slot: web.openapi-paths, template: templates/openapi-paths.sbn }
  # With backend.test.integration testcontainers only (ADR-0002: dropped where no pack declares the slot).
  - { slot: integration-tests.resources, template: templates/testcontainers-resources.sbn, order: 40, optional: true }
agents:
  agents-md: docs/agents.md
adr: docs/adr.md
gates:
  - { kind: architecture-test, describes: "Only the host speaks AG-UI, and it runs no agent: a module or the BuildingBlocks referencing the AG-UI SDK (AGUI.*), the host referencing Agent Framework (Microsoft.Agents.AI*), or anything referencing Agent Framework's AG-UI hosting fails the build naming the assembly.", file: templates/tests/AgentUiGoesThroughAQuery.cs.sbn }
  - { kind: end-to-end-test, describes: "Through Aspire, POST /agents/assistant streams the assistant's answer in more than one TEXT_MESSAGE_CONTENT event after a count_words tool call whose query ran through the dispatcher, and a second turn calls the tool again for its own message and streams its answer in more than one chunk too; an anonymous caller is refused unless backend.auth is none; an unknown agent is not found.", file: templates/tests/AgentUiTests.cs.sbn }
  - { kind: unit-test, describes: "The assistant's query, run through the dispatcher with a stand-in model that asks for a tool call, streams the call, its result and the answer built from it (tests/Modules/Assistant.Tests).", file: templates/tests/TalkToTheAssistantTests.cs.sbn }
  - { kind: lint-rule, describes: "Importing CopilotKit (@copilotkit/*) in the web app fails lint: the panel talks to the agents on @ag-ui/client.", file: templates/web-restricted.sbn }
  - { kind: unit-test, describes: "The agent panel shows the user's messages, each tool call with its result and the answer while it streams, sends the whole conversation with the signed-in user's token to /api/agents/{name}, shows a refused run and a streamed RUN_ERROR as an alert, starts a new conversation for another agent, and passes axe where the project has the accessibility tests (src/agents/AgentPanel.test.tsx).", file: templates/web/AgentPanel.test.tsx.sbn }
  - { kind: unit-test, describes: "With Vue, the same: the agent panel shows the user's messages, each tool call with its result and the answer while it streams, sends the whole conversation with the signed-in user's token to /api/agents/{name}, shows a refused run and a streamed RUN_ERROR as an alert, starts a new conversation for another agent, and passes axe where the project has the accessibility tests (src/agents/AgentPanel.test.ts).", file: templates/web/AgentPanel.test.ts.sbn }
  - { kind: end-to-end-test, describes: "Against the AppHost with the stand-in model, a browser sends two messages from the assistant's page; each answer streams in more than one TEXT_MESSAGE_CONTENT event after a count_words call whose result the panel shows (e2e/agent-panel.spec.ts).", file: templates/web/agent-panel.spec.ts.sbn }
