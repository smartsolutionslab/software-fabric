option: frontend.design-system.web-components
files:
  # The tokens package is frontend.design-system.tokens's, unchanged.
  - { template: templates/tokens/package.json.sbn, target: web/packages/tokens/package.json }
  - { template: templates/tokens/build.mjs.sbn, target: web/packages/tokens/build.mjs }
  - { template: templates/tokens/color.tokens.json.sbn, target: web/packages/tokens/src/color.tokens.json }
  - { template: templates/tokens/radius.tokens.json.sbn, target: web/packages/tokens/src/radius.tokens.json }
  - { template: templates/tokens/spacing.tokens.json.sbn, target: web/packages/tokens/src/spacing.tokens.json }
  - { template: templates/ui/package.json.sbn, target: web/packages/ui/package.json }
  - { template: templates/ui/tsconfig.json.sbn, target: web/packages/ui/tsconfig.json }
  - { template: templates/ui/vite.config.ts.sbn, target: web/packages/ui/vite.config.ts }
  - { template: templates/ui/eslint.config.js.sbn, target: web/packages/ui/eslint.config.js }
  - { template: templates/ui/gitignore.sbn, target: web/packages/ui/.gitignore }
  - { template: templates/ui/storybook-main.ts.sbn, target: web/packages/ui/.storybook/main.ts }
  - { template: templates/ui/storybook-preview.ts.sbn, target: web/packages/ui/.storybook/preview.ts }
  - { template: templates/ui/index.ts.sbn, target: web/packages/ui/src/index.ts }
  - { template: templates/ui/Badge.ts.sbn, target: web/packages/ui/src/Badge.ts }
  - { template: templates/ui/Badge.stories.ts.sbn, target: web/packages/ui/src/Badge.stories.ts }
  - { template: templates/ui/Badge.test.ts.sbn, target: web/packages/ui/src/Badge.test.ts }
  - { template: templates/ui/test-setup.ts.sbn, target: web/packages/ui/src/test-setup.ts }
  # React renders a tag with a hyphen as a custom element by itself, but its JSX types know only HTML's tags.
  - { template: templates/design-system.d.ts.sbn, target: web/app/src/design-system.d.ts, when: 'project["frontend.framework"] == "react"' }
  # A micro-frontend's remote renders the elements too, and type-checks on its own.
  - { template: templates/design-system.d.ts.sbn, target: "web/modules/{{ module.name }}/src/design-system.d.ts", per-module: true, when: 'project["frontend.framework"] == "react" && project["frontend.architecture"] == "micro-frontends"' }
declares-slots:
  - { slot: web.ui-package-fields, description: "Fields of web/packages/ui/package.json after \"private\", each a \"key\": value pair indented two spaces.", separator: ",\n" }
slots:
  - { slot: web.workspace-packages, template: templates/workspace-packages.sbn, order: 10 }
  - { slot: web.dependencies, template: templates/dependencies.sbn }
  - { slot: web.prepare, template: templates/prepare.sbn }
  # As frontend.design-system.tokens: after the UI library's theme (shadcn 15, shadcn-vue 20), before CSS Modules' rules (90).
  - { slot: web.styles, template: templates/styles.sbn, order: 25 }
  # Importing the package defines its elements, once for the app and once for its tests.
  - { slot: web.imports, template: templates/imports.sbn }
  - { slot: web.test-setup, template: templates/imports.sbn }
  # Declared by Vue only (React needs no telling), so dropped with React.
  - { slot: web.custom-element-prefixes, template: templates/custom-element-prefixes.sbn, optional: true }
  - { slot: readme.sections, template: templates/readme.sbn, order: 25 }
agents:
  agents-md: docs/agents.md
adr: docs/adr.md
gates:
  - { kind: ci-step, describes: "The token build fails on a token that references one that does not exist (Style Dictionary throws on broken references); pnpm build, dev and test run it first.", file: templates/tokens/build.mjs.sbn }
  - { kind: ci-step, describes: "The ui package's build type-checks its components and stories and builds Storybook; a story that does not compile fails the frontend job.", file: templates/ui/package.json.sbn }
  - { kind: ci-step, describes: "The ui package's tests fail when a component's shadow styles carry a colour value of their own instead of a token's --ds-* variable.", file: templates/ui/Badge.test.ts.sbn }
