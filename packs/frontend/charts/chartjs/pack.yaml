option: frontend.charts.chartjs
files:
  - { template: templates/chart.tsx.sbn, target: web/app/src/components/chart.tsx, when: 'project["frontend.framework"] == "react"' }
  - { template: templates/DataChart.vue.sbn, target: web/app/src/components/DataChart.vue, when: 'project["frontend.framework"] == "vue"' }
slots:
  - { slot: web.dependencies, template: templates/dependencies.sbn }
  - { slot: web.restricted-imports, template: templates/restricted.sbn, order: 60 }
agents:
  agents-md: docs/agents.md
adr: docs/adr.md
gates:
  - { kind: lint-rule, describes: "Importing ECharts (echarts, echarts-for-react) or Recharts (with Vue, echarts or vue-echarts) fails lint.", file: templates/restricted.sbn }
