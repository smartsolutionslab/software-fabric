declares-slots:
  - { slot: agents.sections, description: "Every pack's agents-md; filled by the generator." }
  - { slot: agents.brief.architect, description: "Every pack's brief for the architect; filled by the generator." }
  - { slot: agents.brief.test-writer, description: "Every pack's brief for the test-writer; filled by the generator." }
  - { slot: agents.brief.backend-engineer, description: "Every pack's brief for the backend-engineer; filled by the generator." }
  - { slot: agents.brief.frontend-engineer, description: "Every pack's brief for the frontend-engineer; filled by the generator." }
  - { slot: agents.brief.infra-engineer, description: "Every pack's brief for the infra-engineer; filled by the generator." }
  - { slot: agents.brief.backend-reviewer, description: "Every pack's brief for the backend-reviewer; filled by the generator." }
  - { slot: agents.brief.frontend-reviewer, description: "Every pack's brief for the frontend-reviewer; filled by the generator." }
  - { slot: agents.brief.security-reviewer, description: "Every pack's brief for the security-reviewer; filled by the generator." }
  - { slot: agents.brief.triage, description: "Every pack's brief for the triage; filled by the generator." }
  - { slot: readme.sections, description: "How to build, run and work on the project, one section per pack that changes it.", separator: "\n\n" }
  - { slot: solution.projects, description: "<Project Path='...' /> lines for projects other packs own." }
  - { slot: dotnet.tools, description: "Entries of the local tool manifest (.config/dotnet-tools.json), restored with dotnet tool restore.", separator: ",\n" }
  - { slot: dotnet.package-versions, description: "<PackageVersion> lines; one owner per package." }
  - { slot: templates.functions, description: "Scriban function definitions every template can call (not_null, not_blank, ...); filled by packs, never rendered as text." }
  - { slot: dotnet.build-items, description: "Item lines (references, usings, analyzer files) in an ItemGroup of Directory.Build.props, conditioned by the contributor." }
  - { slot: dotnet.build-properties, description: "Properties for every .NET project." }
  - { slot: apphost.packages, description: "<PackageReference> lines for the AppHost." }
  - { slot: apphost.project-references, description: "<ProjectReference> lines for the projects the AppHost runs." }
  - { slot: apphost.resources, description: "Statements adding Aspire resources (databases, brokers, identity, frontends)." }
  - { slot: apphost.host, description: "The expression adding the host project, without a semicolon.", cardinality: exactly-one }
  - { slot: apphost.host-wiring, description: "Chained calls on the host, each starting on a new line (.WithReference(...), .WaitFor(...)).", separator: "" }
  - { slot: buildingblocks.packages, description: "<PackageReference> lines for BuildingBlocks." }
  - { slot: modules.infrastructure, description: "Statements registering infrastructure for one module, generic over TModule." }
  - { slot: modules.endpoints, description: "Statements on one module's route group (RouteGroupBuilder group), generic over TModule." }
  - { slot: modules.packages.domain, description: "<PackageReference> lines for every module's Domain project." }
  - { slot: modules.packages.application, description: "<PackageReference> lines for every module's Application project." }
  - { slot: modules.packages.infrastructure, description: "<PackageReference> lines for every module's Infrastructure project." }
  - { slot: modules.packages.api, description: "<PackageReference> lines for every module's Api project." }
  - { slot: tests.build-properties, description: "Properties for every test project." }
  - { slot: tests.packages, description: "<PackageReference> lines for every test project." }
  - { slot: tests.usings, description: "<Using> lines for every test project." }
  - { slot: pr-template.sections, description: "Sections every pull request description has, each starting with a ## heading.", separator: "\n\n" }
  - { slot: ci.backend-steps, description: "Steps of the backend CI job, indented six spaces." }
  - { slot: ci.frontend-steps, description: "Steps of the frontend CI job, indented six spaces." }
agents:
  agents-md: docs/agents.md
adr: docs/adr.md
gates:
  - { kind: architecture-test, describes: "Every module's Api assembly has exactly one IModule (ADR-0005).", file: templates/tests/EveryModuleHasOneIModule.cs.sbn }
  - { kind: ci-step, describes: "build.proj builds every project with warnings as errors.", file: templates/ci.yml.sbn }
