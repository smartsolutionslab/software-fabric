  - { slot: readme.first-steps, description: "Markdown list items: what to do once, right after generating. README.md lists them under First steps, and fabric new prints them." }
  - { slot: readme.sections, description: "How to build, run and work on the project, one section per pack that changes it.", separator: "\n\n" }
  - { slot: solution.projects, description: "<Project Path='...' /> lines for projects other packs own." }
  - { slot: dotnet.tools, description: "Entries of the local tool manifest (.config/dotnet-tools.json), restored with dotnet tool restore.", separator: ",\n" }
  - { slot: dotnet.package-versions, description: "<PackageVersion> lines; one owner per package." }
  - { slot: templates.functions, description: "Scriban function definitions every template can call (not_null, not_blank, ...); filled by packs, never rendered as text." }
  - { slot: dotnet.build-items, description: "Item lines (references, usings, analyzer files) in an ItemGroup of Directory.Build.props, conditioned by the contributor." }
  - { slot: dotnet.build-properties, description: "Properties for every .NET project." }
  - { slot: apphost.packages, description: "<PackageReference> lines for the AppHost." }
  - { slot: apphost.project-references, description: "<ProjectReference> lines for the projects the AppHost runs." }
  - { slot: apphost.resources, description: "Statements adding Aspire resources (databases, brokers, identity, frontends)." }
  - { slot: apphost.host, description: "The expression adding the host project, without a semicolon.", cardinality: exactly-one }
  - { slot: apphost.web, description: "The expression adding the web app, without a semicolon.", cardinality: at-most-one }
  - { slot: apphost.web-wiring, description: "Chained calls on the web app, each starting on a new line.", separator: "" }
  - { slot: apphost.host-wiring, description: "Chained calls on the host, each starting on a new line (.WithReference(...), .WaitFor(...)).", separator: "" }
  - { slot: service-defaults.activity-sources, description: "C# string expressions naming more ActivitySources the tracer listens to, besides the application's own: a library's spans that only exist with a listener.", separator: ", " }
  - { slot: buildingblocks.packages, description: "<PackageReference> lines for BuildingBlocks." }
  - { slot: modules.infrastructure, description: "Statements registering infrastructure for one module, generic over TModule." }
  - { slot: modules.endpoints, description: "Statements on one module's route group (RouteGroupBuilder group), generic over TModule." }
  - { slot: modules.packages.domain, description: "<PackageReference> lines for every module's Domain project." }
  - { slot: modules.packages.application, description: "<PackageReference> lines for every module's Application project." }
  - { slot: modules.packages.infrastructure, description: "<PackageReference> lines for every module's Infrastructure project." }
  - { slot: modules.packages.api, description: "<PackageReference> lines, and other items its build needs (a Protobuf glob), for every module's Api project." }
  - { slot: tests.build-properties, description: "Properties for every test project." }
  - { slot: tests.packages, description: "<PackageReference> lines for every test project." }
  - { slot: tests.usings, description: "<Using> lines for every test project." }
  - { slot: tests.architecture.references, description: "<PackageReference> and <ProjectReference> lines for tests/Architecture.Tests, for a rule that looks at more than the module assemblies (the host, say)." }
  - { slot: pr-template.sections, description: "Sections every pull request description has, each starting with a ## heading.", separator: "\n\n" }
  - { slot: ci.backend-steps, description: "Steps of the backend CI job, indented six spaces." }
  - { slot: ci.frontend-steps, description: "Steps of the frontend CI job, indented six spaces." }
  - { slot: dependabot.updates, description: "Entries of .github/dependabot.yml's updates list, indented two spaces: one per package ecosystem a pack adds (NuGet and GitHub Actions are the base's).", separator: "\n\n" }
  - { slot: dependabot.nuget-ignore, description: "Entries of the NuGet entry's ignore list in .github/dependabot.yml, indented six spaces: one per package version the contributing pack holds back on purpose, each under a comment saying why and naming the smartsolutionslab/software-fabric issue that lifts the hold (whose change removes the entry)." }
  - { slot: ci.e2e-steps, description: "Steps of the e2e CI job after .NET and Aspire are set up: build, start the application, run the end-to-end tests. No contribution, no job." }
slots:
  # With an identity provider: GET /me, reading the claim the provider names (user_name_claim).
  - { slot: host.endpoints, template: templates/Host/host-endpoints.sbn, order: 10 }
  - { slot: tests.module-host-services, template: templates/Llm/module-host-services.sbn }
  - { slot: dependabot.nuget-ignore, template: templates/dependabot-nuget-ignore.sbn }
agents:
  agents-md: docs/agents.md
adr: docs/adr.md
gates:
  - { kind: architecture-test, describes: "Every module's Api assembly has exactly one IModule (ADR-0005).", file: templates/tests/EveryModuleHasOneIModule.cs.sbn }
  - { kind: architecture-test, describes: "HttpClients from AddServiceDefaults() retry only idempotent methods; a POST or PATCH gets one attempt.", file: templates/tests/HttpClientsRetryOnlyIdempotentMethods.cs.sbn }
  - { kind: architecture-test, describes: "RetryEveryMethod() opts one HttpClient back into retrying POST and PATCH on transient failures.", file: templates/tests/RetryEveryMethodOptsAClientBackIn.cs.sbn }
  - { kind: architecture-test, describes: "AddStandardResilienceHandler is called only in src/ServiceDefaults; a second call nests a second pipeline (4 attempts become 16).", file: templates/tests/StandardResilienceHandlerOnlyInServiceDefaults.cs.sbn }
  - { kind: architecture-test, describes: "With an identity provider (backend.auth not none): every endpoint of the host requires authorization or is mapped with AllowAnonymous().", file: templates/tests/EveryEndpointDeclaresItsAuthorization.cs.sbn }
  - { kind: architecture-test, describes: "With authorization choices (backend.authorization not empty): every policy a module endpoint names is registered by that module's IModulePolicies, and by no other module.", file: templates/tests/EveryEndpointPolicyIsRegisteredByItsModule.cs.sbn }
  - { kind: architecture-test, describes: "With authorization choices (backend.authorization not empty): no two modules register a policy under the same name, whether or not an endpoint or MCP tool names it; the host refuses to start on the same names (ModulePolicyOwners), naming both modules.", file: templates/tests/EveryPolicyIsRegisteredByOneModule.cs.sbn }
  - { kind: architecture-test, describes: "Every workflow step uses an action pinned to a full commit SHA, a local action or a docker image by digest.", file: templates/tests/WorkflowActionsArePinned.cs.sbn }
  - { kind: analyzer, describes: "DateTime.Now, DateTime.UtcNow, DateTimeOffset.Now and DateTimeOffset.UtcNow are banned (RS0030) in every project but the AppHost; the time comes from TimeProvider.", file: templates/TimeBannedSymbols.txt.sbn }
  - { kind: analyzer, describes: "Guid.NewGuid is banned (RS0030) in every project but the AppHost, tests included; every Guid is a time-ordered Guid.CreateVersion7().", file: templates/IdentifierBannedSymbols.txt.sbn }
  - { kind: analyzer, describes: "One top-level type per file, named after the type (StyleCop SA1402, SA1649); nested types and generated migrations excepted.", file: templates/stylecop.json.sbn }
  - { kind: ci-step, describes: "build.proj builds every project with warnings as errors.", file: templates/ci.yml.sbn }
  - { kind: ci-step, describes: "Every project under src/ and tests/ is formatted as dotnet format would format it (whitespace and code style).", file: templates/format.sh.sbn }
  - { kind: architecture-test, describes: "With a backend.llm provider: no module's Domain or Application references a model client or provider SDK, only Microsoft.Extensions.AI.Abstractions (IChatClient).", file: templates/Llm/ProviderSdksStayOutOfDomainAndApplication.cs.sbn }
  - { kind: architecture-test, describes: "With a backend.llm provider: no appsettings*.json holds an API key, found by its name or a provider key's prefix; the violation names the file and the setting, never the value.", file: templates/Llm/NoApiKeyInSettings.cs.sbn }
