option: module.event-store.kurrentdb
files:
  - { template: templates/KurrentDbAggregateStore.cs.sbn, target: src/BuildingBlocks/EventStore/KurrentDbAggregateStore.cs }
  - { template: templates/EventStoreRegistration.cs.sbn, target: src/BuildingBlocks/EventStore/Wiring/EventStoreRegistration.cs }
  - { template: templates/ModuleEventStore.cs.sbn, target: src/BuildingBlocks/EventStore/ModuleEventStore.cs }
  - { template: templates/ModuleAggregateStore.cs.sbn, target: "src/Modules/{{ module.namespace }}/{{ module.namespace }}.Infrastructure/EventStore/{{ module.namespace }}AggregateStore.cs", per-module: true }
  - { template: templates/OnlyInfrastructureUsesKurrentDb.cs.sbn, target: tests/Architecture.Tests/Rules/OnlyInfrastructureUsesKurrentDb.cs }
declares-slots:
  - { slot: event-store.json-converters, description: "Statements on JsonSerializerOptions json, the System.Text.Json options every module's KurrentDB events are written and read with, each indented twelve spaces: json.Converters.Add(new SomeConverter()). Rendered only with a contribution; a role slot of module.event-store." }
slots:
  - { slot: dotnet.package-versions, template: templates/package-versions.sbn }
  - { slot: apphost.packages, template: templates/apphost-package.sbn }
  - { slot: apphost.resources, template: templates/apphost-resources.sbn, order: 35 }
  - { slot: apphost.host-wiring, template: templates/apphost-host-wiring.sbn, order: 35 }
  - { slot: buildingblocks.packages, template: templates/buildingblocks-packages.sbn }
  - { slot: modules.infrastructure, template: templates/module-infrastructure.sbn, order: 30 }
  # With backend.test.integration testcontainers only (ADR-0002: dropped where no pack declares the slot).
  - { slot: integration-tests.resources, template: templates/testcontainers-resources.sbn, order: 35, optional: true }
agents:
  agents-md: docs/agents.md
adr: docs/adr.md
gates:
  - { kind: architecture-test, describes: "Only a module's Infrastructure project references KurrentDB.", file: templates/OnlyInfrastructureUsesKurrentDb.cs.sbn }
  - { kind: ci-step, describes: "KurrentDB becomes healthy and the host, which waits for it, reports itself healthy; checked by the integration tests of the aspire-fixture pack against the running stack." }
