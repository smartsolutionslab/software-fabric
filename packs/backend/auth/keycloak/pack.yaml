option: backend.auth.keycloak
files:
  - { template: templates/realm.json.sbn, target: src/AppHost/realms/realm.json }
  - { template: templates/Authentication.cs.sbn, target: src/Host/Wiring/Authentication.cs }
  - { template: templates/CurrentUser.cs.sbn, target: src/Host/CurrentUser.cs }
  # With backend.authorization roles: Keycloak's realm and client roles become ClaimTypes.Role (ADR-0009: the provider decides what the token carries).
  - { template: templates/KeycloakRoleClaims.cs.sbn, target: src/Host/KeycloakRoleClaims.cs, when: 'object.has_key(project, "backend.authorization") && array.contains(project["backend.authorization"], "roles")' }
  - { template: templates/RoleClaims.cs.sbn, target: src/Host/Wiring/RoleClaims.cs, when: 'object.has_key(project, "backend.authorization") && array.contains(project["backend.authorization"], "roles")' }
slots:
  - { slot: templates.functions, template: templates/functions.sbn }
  - { slot: dotnet.package-versions, template: templates/package-versions.sbn }
  - { slot: apphost.resources, template: templates/apphost-resources.sbn, order: 20 }
  - { slot: apphost.host-wiring, template: templates/apphost-host-wiring.sbn, order: 20 }
  - { slot: apphost.web-wiring, template: templates/apphost-web-wiring.sbn, order: 20 }
  - { slot: host.packages, template: templates/host-package.sbn }
  - { slot: host.services, template: templates/host-services.sbn }
  - { slot: host.middleware, template: templates/host-middleware.sbn, order: -10 }
  - { slot: modules.endpoints, template: templates/module-endpoints.sbn, order: -10 }
  - { slot: host.endpoints, template: templates/host-endpoints.sbn, order: 10 }
  - { slot: tests.architecture.references, template: templates/architecture-tests-references.sbn }
  # With backend.test.integration testcontainers only (ADR-0002: dropped where no pack declares the slot).
  - { slot: integration-tests.resources, template: templates/testcontainers-resources.sbn, order: 20, optional: true }
  - { slot: integration-tests.packages, template: templates/testcontainers-package.sbn, order: 20, optional: true }
agents:
  agents-md: docs/agents.md
adr: docs/adr.md
gates:
  - { kind: ci-step, describes: "A module endpoint answers 401 without a token; checked by the integration tests of the aspire-fixture pack against the running stack." }
  - { kind: ci-step, describes: "Keycloak's reset-password email reaches Mailpit when the AppHost runs; checked by the integration tests of the aspire-fixture pack against the running stack." }
