  - { template: templates/tests/Mcp.Server.Tests.csproj.sbn, target: tests/Mcp.Server.Tests/Mcp.Server.Tests.csproj }
  - { template: templates/tests/McpHost.cs.sbn, target: tests/Mcp.Server.Tests/McpHost.cs }
  - { template: templates/tests/McpServerTests.cs.sbn, target: tests/Mcp.Server.Tests/McpServerTests.cs }
  - { template: templates/tests/Shout.cs.sbn, target: tests/Mcp.Server.Tests/Shout.cs }
  - { template: templates/tests/Shouted.cs.sbn, target: tests/Mcp.Server.Tests/Shouted.cs }
  - { template: templates/tests/ShoutHandler.cs.sbn, target: tests/Mcp.Server.Tests/ShoutHandler.cs }
