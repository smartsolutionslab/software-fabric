  - { template: templates/McpToolScan.cs.sbn, target: src/BuildingBlocks/Mcp/McpToolScan.cs }
  - { template: templates/McpToolCatalog.cs.sbn, target: src/BuildingBlocks/Mcp/McpToolCatalog.cs }
  - { template: templates/RequestTool.cs.sbn, target: src/Host/Mcp/RequestTool.cs }
  - { template: templates/McpServerRegistration.cs.sbn, target: src/Host/Wiring/McpServerRegistration.cs }
