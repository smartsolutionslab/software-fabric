option: backend.llm.anthropic
files:
  - { template: templates/AnthropicChatClient.cs.sbn, target: src/BuildingBlocks/Llm/Wiring/AnthropicChatClient.cs }
  - { template: templates/AnthropicIsTheProjectsModel.cs.sbn, target: tests/Architecture.Tests/Rules/AnthropicIsTheProjectsModel.cs }
slots:
  - { slot: dotnet.package-versions, template: templates/package-version.sbn }
  - { slot: buildingblocks.packages, template: templates/buildingblocks-package.sbn }
  - { slot: apphost.resources, template: templates/apphost-resources.sbn, order: 30 }
  - { slot: apphost.host-wiring, template: templates/apphost-host-wiring.sbn, order: 30 }
  - { slot: host.services, template: templates/host-services.sbn }
  - { slot: integration-tests.parameters, template: templates/integration-tests-parameters.sbn, optional: true }
  # The end-to-end script's AppHost waits for this parameter as the fixture's would; a project without a web app has no script.
  - { slot: e2e.apphost-arguments, template: templates/e2e-apphost-arguments.sbn, optional: true }
  - { slot: readme.first-steps, template: templates/first-steps.sbn }
  # With backend.test.integration testcontainers only (ADR-0002: dropped where no pack declares the slot).
  - { slot: integration-tests.resources, template: templates/testcontainers-resources.sbn, order: 30, optional: true }
agents:
  agents-md: docs/agents.md
adr: docs/adr.md
gates:
  - { kind: architecture-test, describes: "The host's Program.cs calls AddAnthropicChatClient, which registers Claude as the project's IChatClient behind logging and OpenTelemetry, with the key and model the AppHost supplies; a missing key fails naming its parameter. No request is sent.", file: templates/AnthropicIsTheProjectsModel.cs.sbn }
