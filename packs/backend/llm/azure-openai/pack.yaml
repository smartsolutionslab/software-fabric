option: backend.llm.azure-openai
files:
  - { template: templates/AzureOpenAIChatClient.cs.sbn, target: src/BuildingBlocks/Llm/Wiring/AzureOpenAIChatClient.cs }
  - { template: templates/AzureOpenAIIsTheProjectsModel.cs.sbn, target: tests/Architecture.Tests/Rules/AzureOpenAIIsTheProjectsModel.cs }
slots:
  - { slot: dotnet.package-versions, template: templates/package-version.sbn }
  - { slot: buildingblocks.packages, template: templates/buildingblocks-package.sbn }
  - { slot: apphost.resources, template: templates/apphost-resources.sbn, order: 30 }
  - { slot: apphost.host-wiring, template: templates/apphost-host-wiring.sbn, order: 30 }
  - { slot: host.services, template: templates/host-services.sbn }
  - { slot: integration-tests.parameters, template: templates/integration-tests-parameters.sbn }
  # The end-to-end script's AppHost waits for this parameter as the fixture's would; a project without a web app has no script.
  - { slot: e2e.apphost-arguments, template: templates/e2e-apphost-arguments.sbn, optional: true }
  - { slot: readme.first-steps, template: templates/first-steps.sbn }
agents:
  agents-md: docs/agents.md
adr: docs/adr.md
gates:
  - { kind: architecture-test, describes: "The host's Program.cs calls AddAzureOpenAIChatClient, which registers the Azure OpenAI deployment as the project's IChatClient behind logging and OpenTelemetry, against <endpoint>/openai/v1/ with the endpoint, deployment and key the AppHost supplies; a missing endpoint or key fails naming its parameter. No request is sent.", file: templates/AzureOpenAIIsTheProjectsModel.cs.sbn }
