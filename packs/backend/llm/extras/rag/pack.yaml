  agents-md: docs/agents.md
adr: docs/adr.md
gates:
  - { kind: architecture-test, describes: "A module's types use ModuleVectorIndex<TContext> (and, with shared records, SharedVectorIndex<TContext>) only with that module's own DbContext, in a signature, field, local or method body: one over another module's DbContext or a generic parameter, or one passing another module's DbContext to a generic type or method, fails the build, naming the type and both modules.", file: templates/ModulesSearchOnlyTheirOwnVectors.cs.sbn }
  - { kind: unit-test, describes: "Against the AppHost's database (pgvector image) after the MigrationRunner: every module's schema has its embeddings table of the model's size with an HNSW cosine index, creating them again keeps their records, a search with FakeEmbeddingGenerator returns the nearest records first, also more than HNSW's default breadth of 40 through the index, without a tenant column as many as asked, ranked exactly, when the index cannot reach some records and answers short, and indexing a key again replaces it.", file: templates/tests/VectorIndexTests.cs.sbn }
  - { kind: unit-test, describes: "Under a tenant column, against the same database: each tenant's search returns only the records it indexed, a key both tenants index keeps a record for each, a tenant finds its records through the HNSW index even when the scan runs out among other tenants' nearer records, and without a tenant a search finds nothing and indexing fails.", file: templates/tests/TenantVectorIndexTests.cs.sbn }
  - { kind: unit-test, describes: "Under a schema per tenant, against the same database: each listed tenant's records lie in the vector table of its own schema and its search returns only them, a key both tenants index keeps a record for each, and a tenant not listed, like no tenant, finds nothing, removes nothing and cannot index.", file: templates/tests/TenantSchemaVectorIndexTests.cs.sbn }
  - { kind: unit-test, describes: "With records shared by all tenants (a tenant column, roles and Keycloak or generic OIDC), against the same database: what staff index inside WritesSharedRecords() every tenant, staff reading all tenants and work without a tenant find; a tenant's own index never returns it nor another tenant's records; and indexing or removing outside WritesSharedRecords() fails and changes nothing.", file: templates/tests/SharedVectorIndexTests.cs.sbn }
