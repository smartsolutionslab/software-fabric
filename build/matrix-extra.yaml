# Combinations the pairwise matrix contains besides its covering set (ADR-0003): a defect that needs three options,
# or a second module style, together is covered by adding that combination here, with the reason it is needed.
# `fabric matrix` fills the dimensions a combination leaves out as it fills a pairwise row, and fails when no valid
# choice set contains the choices it pins. Regenerate build/matrix.json after changing this file.
#
# combinations:
#   - reason: <the defect, and the issue that found it>
#     choices:
#       backend.database: postgres
#       backend.api-protocols: [rest]
combinations:
  - reason: >-
      #465: with Wolverine's mediator and an authorization choice, every dashboards request answered 500, in the host and
      in the generative module tests' host; pairwise coverage does not keep the three together. Tenancy none, because
      schema-per-tenant rows stopped at the backend build then (#430, #462) and never reached the dashboards tests.
    choices:
      frontend.dashboards: [user-editable, generative]
      backend.mediator: wolverine
      backend.authorization: [roles]
      backend.tenancy: none
